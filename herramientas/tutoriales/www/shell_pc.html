<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>shell</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;font-family:Inter,Roboto,Arial,sans-serif;background:#dfe3e8}
#tabs{height:34px;background:#dee1e6;display:flex;align-items:flex-end;padding-left:10px;gap:6px}
.tab{height:28px;background:#fff;border-radius:9px 9px 0 0;width:250px;display:flex;align-items:center;gap:8px;padding:0 12px;font-size:12.5px;color:#202124}
.tab img{width:16px;height:16px;border-radius:3px}.tab .x{margin-left:auto;color:#5f6368;font-size:13px}
.plus{color:#5f6368;font-size:18px;margin:0 0 4px 4px}
#bar{height:42px;background:#fff;display:flex;align-items:center;gap:10px;padding:0 10px;border-bottom:1px solid #dadce0}
.nb{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#5f6368}
.nb svg{width:18px;height:18px}
#omni{flex:1;height:32px;background:#f1f3f4;border-radius:16px;display:flex;align-items:center;padding:0 12px;gap:8px;position:relative}
#omni svg.lk{width:14px;height:14px;color:#5f6368}
#url{flex:1;border:0;background:transparent;font:14px Inter,Roboto,Arial,sans-serif;color:#202124;outline:none}
#instIco{width:26px;height:26px;border-radius:50%;display:none;align-items:center;justify-content:center;color:#3c4043}
#instIco svg{width:18px;height:18px}
.loaded #instIco{display:flex}
#frame{position:absolute;left:0;top:76px;width:1280px;height:644px;border:0;background:#fff}
#blank{position:absolute;left:0;top:76px;width:1280px;height:644px;background:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;color:#5f6368}
#blank .sb{width:560px;height:46px;border:1px solid #dfe1e5;border-radius:23px;display:flex;align-items:center;padding:0 18px;color:#9aa0a6;font-size:14px}
.loaded #blank{display:none}
/* Ventana de instalación */
#inst{position:absolute;right:120px;top:70px;width:340px;background:#fff;border-radius:10px;box-shadow:0 6px 28px rgba(0,0,0,.28);padding:18px 18px 14px;display:none;z-index:20;font-size:13.5px;color:#202124}
#inst.on{display:block}
#inst h4{margin:0 0 12px;font-size:15px;font-weight:600}
#inst .ap{display:flex;gap:12px;align-items:center}#inst .ap img{width:40px;height:40px;border-radius:8px}
#inst .ap small{display:block;color:#5f6368;font-size:12px}
#inst .bt{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
#inst button{border:1px solid #dadce0;background:#fff;color:#1a73e8;border-radius:16px;padding:7px 16px;font:600 13px Inter,sans-serif}
#inst button.p{background:#1a73e8;color:#fff;border-color:#1a73e8}
/* Modo aplicación instalada */
#title{display:none;height:32px;background:#0A2A66;color:#fff;align-items:center;gap:8px;padding:0 12px;font-size:13px}
#title img{width:16px;height:16px;border-radius:3px}#title .wc{margin-left:auto;letter-spacing:14px;opacity:.8}
.app #tabs,.app #bar{display:none}.app #title{display:flex}.app #frame{top:32px;height:688px}
/* Escritorio */
#desk{position:absolute;inset:0;background:linear-gradient(135deg,#1e3c72,#2a5298 60%,#6dd5ed);display:none;z-index:30}
#desk.on{display:block}
#desk .ic{position:absolute;left:36px;width:92px;text-align:center;color:#fff;font-size:12.5px;text-shadow:0 1px 2px rgba(0,0,0,.6)}
#desk .ic img,#desk .ic i{display:block;margin:0 auto 6px;width:52px;height:52px;border-radius:12px}
#desk .ic i{background:rgba(255,255,255,.25)}
#desk .task{position:absolute;left:0;right:0;bottom:0;height:46px;background:rgba(20,24,35,.85)}
/* Cursor */
#cur{position:absolute;left:960px;top:600px;width:33px;height:33px;z-index:100;pointer-events:none;transition:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.45))}
.rip{position:absolute;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;border:4px solid rgba(26,115,232,.85);z-index:99;pointer-events:none;animation:rp .45s ease-out forwards}
@keyframes rp{from{transform:scale(.3);opacity:1}to{transform:scale(1.4);opacity:0}}
</style></head>
<body>
<div id="wrap" style="zoom:1.5;position:absolute;left:0;top:0;width:1280px;height:720px;overflow:hidden">
<div id="tabs"><div class="tab"><img id="fav" src="icon-192.png" style="visibility:hidden"><span id="tabT">Nueva pestaña</span><span class="x">✕</span></div><span class="plus">+</span></div>
<div id="bar">
  <span class="nb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></span>
  <span class="nb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></span>
  <span class="nb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg></span>
  <div id="omni"><svg class="lk" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
    <input id="url" placeholder="Busca en Google o escribe una URL" autocomplete="off" spellcheck="false">
    <span id="instIco" title="Instalar VerifyCredit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M12 7v6M9 10l3 3 3-3M8 21h8"/></svg></span></div>
  <span class="nb"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg></span>
</div>
<div id="title"><img src="icon-192.png"><span>VerifyCredit</span><span class="wc">–▢✕</span></div>
<div id="blank"><div style="font-size:34px;font-weight:600;color:#bdc1c6;letter-spacing:1px">Nueva pestaña</div><div class="sb">Busca en Google o escribe una URL</div></div>
<iframe id="frame"></iframe>
<div id="inst"><h4>¿Instalar app?</h4><div class="ap"><img src="icon-192.png"><div><b>VerifyCredit</b><small>verifycredit.vercel.app</small></div></div>
  <div class="bt"><button id="instNo">Cancelar</button><button class="p" id="instOk">Instalar</button></div></div>
<div id="desk"><div class="ic" style="top:30px"><i></i>Papelera</div><div class="ic" style="top:130px"><i></i>Documentos</div>
  <div class="ic" style="top:230px" id="deskApp"><img src="icon-192.png">VerifyCredit</div><div class="task"></div></div>
</div>
<svg id="cur" viewBox="0 0 24 24"><path d="M4 2l15 11-6.5 1.2L16 21l-3 1.4-3.4-6.6L4 20z" fill="#fff" stroke="#111" stroke-width="1.3" stroke-linejoin="round"/></svg>
<script>
const $ = s => document.querySelector(s);
const SHELL = {
  cargar(){ document.body.classList.add('loaded'); $('#url').value = 'verifycredit.vercel.app'; $('#url').blur(); $('#tabT').textContent = 'VerifyCredit · Análisis de créditos'; $('#fav').style.visibility = 'visible'; $('#frame').src = 'index.html'; },
  instalar(on){ $('#inst').classList.toggle('on', on); },
  modoApp(){ $('#inst').classList.remove('on'); document.body.classList.add('app'); },
  escritorio(on){ $('#desk').classList.toggle('on', on); },
  cursor(x, y, ms){ const c = $('#cur'); return new Promise(r => { const x0 = parseFloat(c.style.left) || 960, y0 = parseFloat(c.style.top) || 600, t0 = performance.now();
    const f = t => { const k = Math.min(1, (t - t0) / ms), e = k < .5 ? 2*k*k : 1 - Math.pow(-2*k + 2, 2) / 2; c.style.left = (x0 + (x - x0) * e) + 'px'; c.style.top = (y0 + (y - y0) * e) + 'px'; if (k < 1) requestAnimationFrame(f); else r(); };
    requestAnimationFrame(f); }); },
  ripple(x, y){ const d = document.createElement('div'); d.className = 'rip'; d.style.left = x + 'px'; d.style.top = y + 'px'; document.body.appendChild(d); setTimeout(() => d.remove(), 500); },
  ocultarCursor(v){ $('#cur').style.display = v ? 'none' : ''; }
};
$('#url').addEventListener('keydown', e => { if (e.key === 'Enter') SHELL.cargar(); });
</script>
</body></html>
