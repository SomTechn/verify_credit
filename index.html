  --bg:#0B1426; --card:#13203A; --ink:#EAF3FF; --ink2:#A9B8D0; --muted:#7D8DA8; --line:#22324F;
  --brand:#4C9AFF; --brand-dk:#1877F2; --brand2:#16284A; --gray-bg:#2a2d2f; --blue-bg:#1b2a40; --green-bg:#17301f; --red-bg:#3a1d1a;
  --amber-bg:#3a2e12; --violet-bg:#2a2140; --teal-bg:#15312c; --gray:#a4abb3; --blue:#7fb0f0; --green:#6fd08f;
  --red:#f28b82; --amber:#f0c060; --violet:#b9a0f0; --teal:#5fd0bb; --s1:#4C9AFF; --s2:#d95926;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,.name,.kpi .v,.res .box .v,.login .logo,.col-h b{font-family:Poppins,Inter,system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
header.top{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#1877F2,#0B5AD6);color:#fff;padding:10px 16px 0}
header.top .row{display:flex;align-items:center;gap:10px}
header.top h1{font-size:19px;margin:0;flex:1;font-weight:800;letter-spacing:-.3px;line-height:1.05}
header.top h1 .plus{color:var(--accent)} header.top h1 small{display:block;font:600 10px/1.4 Inter,sans-serif;letter-spacing:1.4px;text-transform:uppercase;opacity:.85}
header.top .who{font-size:12px;opacity:.9;text-align:right}
/* Conexión / sin señal */
.netpill{border:0;border-radius:999px;padding:5px 10px;font:700 11.5px Inter,sans-serif;cursor:pointer;white-space:nowrap}
.netpill.off{background:#FFD400;color:#0A2A66}
.netpill.pend{background:rgba(255,255,255,.2);color:#fff}
.netpill.err{background:#fde8e6;color:#b42318}
.netbar{background:#FFF4C2;color:#6b4e00;font-size:12.5px;padding:6px 16px;text-align:center;border-bottom:1px solid #f0d66a}
.netbar b{color:#0A2A66}
.ob-item{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0;font-size:13px}
.ob-item.err{border-color:var(--red);background:var(--red-bg)}
.iconbtn{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:10px;padding:7px 10px;font-size:14px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:10px -16px 0;padding:0 12px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:none;background:none;border:0;color:rgba(255,255,255,.78);padding:9px 10px 11px;border-bottom:3px solid transparent;font-weight:600;font-size:14px;white-space:nowrap}
nav.tabs button.on{color:#fff;border-color:var(--accent)}
nav.tabs .n{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:rgba(255,255,255,.22);font-size:11px;line-height:18px;text-align:center}
main{padding:12px 16px 110px;max-width:900px;margin:0 auto}
main.wide{max-width:1400px}
.search{display:flex;gap:8px;margin-bottom:10px}
.search input{flex:1}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brand)}
label.f{display:block;font-size:12px;color:var(--ink2);margin:10px 0 4px;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px;margin-bottom:10px;border:1px solid var(--line)}
.sol{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.sol:active{transform:scale(.995)}
.sol .main{flex:1;min-width:0}
.sol .name{font-weight:650;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sol .sub{font-size:12.5px;color:var(--ink2);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 10px}
.sol .right{text-align:right;flex:none}
.sol .amt{font-weight:700;font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-size:11.5px;font-weight:650;padding:2px 8px;border-radius:999px;white-space:nowrap}
.c-gray{color:var(--gray);background:var(--gray-bg)} .c-blue{color:var(--blue);background:var(--blue-bg)}
.c-green{color:var(--green);background:var(--green-bg)} .c-red{color:var(--red);background:var(--red-bg)}
.c-amber{color:var(--amber);background:var(--amber-bg)} .c-violet{color:var(--violet);background:var(--violet-bg)}
.c-teal{color:var(--teal);background:var(--teal-bg)}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:650;background:var(--gray-bg);color:var(--ink)}
.btn.pri{background:var(--brand);color:#fff}
.btn.pri:active{background:var(--brand-dk)}
.btn.ok{background:var(--green);color:#fff} .btn.bad{background:var(--red);color:#fff}
.btn.ghost{background:none;border:1px solid var(--line)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btns .btn{flex:1;min-width:120px}
.fab{position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:15;background:var(--accent);color:var(--accent-ink);border:0;border-radius:28px;padding:14px 20px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.seg{display:flex;background:var(--gray-bg);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:8px 6px;font-weight:600;font-size:13.5px;color:var(--ink2)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.filters{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;scrollbar-width:none}
.filters button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:13px}
.filters button.on{background:var(--brand);border-color:var(--brand);color:#fff}

/* Modal / hoja */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet .bar{position:sticky;top:0;z-index:2;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 12px}
.sheet .bar h2{flex:1;font-size:24px;line-height:1.2;margin:0;text-align:center;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.sheet .bar #sheetBack{flex:0 0 96px;text-align:left}
.sheet .bar #sheetChip{flex:0 0 96px;text-align:right}
@media (max-width:600px){.sheet .bar h2{font-size:19px}.sheet .bar #sheetBack,.sheet .bar #sheetChip{flex-basis:64px}}
.sheet .body{padding:12px 16px 60px;max-width:760px;margin:0 auto}
.back{background:none;border:0;font-size:22px;padding:2px 8px;color:var(--ink)}
.dlg-wrap{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.dlg{background:var(--card);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
@media (min-width:600px){.dlg-wrap{align-items:center}.dlg{border-radius:18px}}
.dlg h3{margin:0 0 6px}
h4.sec{margin:18px 0 8px;font-size:13px;letter-spacing:.4px;text-transform:uppercase;color:var(--ink2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:14px}
.kv dt{color:var(--ink2)} .kv dd{margin:0;font-weight:550;word-break:break-word}
.alert{border-radius:10px;padding:9px 12px;font-size:13.5px;margin:8px 0}
.alert.warn{background:var(--amber-bg);color:var(--amber)} .alert.err{background:var(--red-bg);color:var(--red)}
.alert.info{background:var(--blue-bg);color:var(--blue)} .alert.ok{background:var(--green-bg);color:var(--green)}

/* Ingresos */
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;color:var(--ink2);text-align:left;padding:6px 6px;border-bottom:1px solid var(--line)}
table.t td{padding:7px 6px;white-space:nowrap;border-bottom:1px solid var(--line)}
table.t td.num,table.t th.num{text-align:right;font-variant-numeric:tabular-nums}
/* Historial */
.hfd > summary{cursor:pointer;font:700 13px Poppins,Inter,sans-serif;color:var(--ink2);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.hf{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px 10px;align-items:end}
.hf label{font-size:11.5px;font-weight:700;color:var(--ink2);display:block;margin-bottom:3px}
.hf select,.hf input{padding:7px 9px;font-size:13.5px}
.htot{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;margin:10px 2px}
.htot b{font-family:Poppins,Inter,sans-serif}
.tbl-wrap{overflow:auto;max-height:68vh;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table.ht{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
table.ht th{position:sticky;top:0;z-index:1;background:var(--bg);font-size:11px;text-transform:uppercase;letter-spacing:.3px;color:var(--ink2);text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
table.ht th:hover{color:var(--brand-dk)}
table.ht th.on{color:var(--brand-dk)}
table.ht td{padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:top}
table.ht tbody tr{cursor:pointer}
table.ht tbody tr:hover td{background:var(--rb,rgba(24,119,242,.06))}
table.ht .num{text-align:right;font-variant-numeric:tabular-nums}
table.ht tfoot td{position:sticky;bottom:0;background:var(--bg);font-weight:700;border-top:2px solid var(--line)}
table.ht td.cli{max-width:220px;overflow:hidden;text-overflow:ellipsis}
table.ht td.nota{max-width:220px;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
.hpag{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:8px;font-size:13px}
.addrow{display:grid;grid-template-columns:1.2fr 1fr auto auto;gap:6px;margin-top:8px}
@media (max-width:420px){.addrow{grid-template-columns:1fr 1fr}.addrow .seg{grid-column:1/-1}}
.res{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.res .box{background:var(--brand2);border-radius:12px;padding:10px 12px}
.res .box .l{font-size:11.5px;color:var(--ink2);font-weight:600}
.res .box .v{font-size:19px;font-weight:750;font-variant-numeric:tabular-nums}
.res .box.full{grid-column:1/-1}
.x{background:none;border:0;color:var(--muted);font-size:18px;padding:0 6px}

/* Comentarios estilo Facebook */
.cm{display:flex;gap:8px;margin:10px 0}
.av{flex:none;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff}
.av.sm{width:26px;height:26px;font-size:11px}
.cm-b{min-width:0;flex:1}
.bubble{display:inline-block;background:var(--gray-bg);border-radius:16px;padding:7px 12px;max-width:100%}
.bubble .au{font-weight:700;font-size:13.5px}
.bubble .rl{font-size:11px;color:var(--muted);font-weight:600;margin-left:4px}
.bubble .tx{white-space:pre-wrap;word-break:break-word;font-size:14.5px}
.cm-meta{font-size:12px;color:var(--ink2);padding:3px 10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.cm-meta button{background:none;border:0;padding:0;font-weight:700;color:var(--ink2);font-size:12px}
.cm-meta button.liked{color:var(--s1)}
.likes{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0 6px;font-size:11.5px}
.replies{margin-left:6px}
.composer{display:flex;gap:8px;align-items:flex-end;margin-top:8px}
.composer textarea{border-radius:18px;padding:9px 14px;resize:none;min-height:40px;max-height:140px;background:var(--gray-bg);border-color:transparent}
.send{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:var(--brand);color:#fff;font-size:17px}

/* Timeline */
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:14px}
.tl .ev{position:relative;margin-bottom:10px;font-size:13.5px}
.tl .ev:before{content:"";position:absolute;left:-20px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--brand)}
.tl .ev small{color:var(--muted)}

/* Verificación */
.item{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:var(--card)}
.item.done{border-color:var(--green)}
.item .hd{display:flex;align-items:center;gap:10px;font-weight:650}
.item .hd input{width:22px;height:22px;flex:none}
.thumbs{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.chk{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:var(--card);font-weight:550}
.chk input{width:20px;height:20px;flex:none}

/* Stats */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:640px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi .l{font-size:12px;color:var(--ink2);font-weight:600}
.kpi .v{font-size:24px;font-weight:750;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .s{font-size:12px;color:var(--muted)}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--ink2);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 8px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-100%);z-index:3}
.hbar{display:grid;grid-template-columns:minmax(110px,190px) 1fr auto;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.hbar .tr{background:var(--gray-bg);border-radius:4px;height:14px;overflow:hidden}
.hbar .fl{height:100%;background:var(--s1);border-radius:0 4px 4px 0}
.pipe{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.pipe .st{flex:1;min-width:92px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;text-align:center}
.pipe .st b{display:block;font-size:20px}
/* Tablero kanban */
.bd-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.bd-top .day{font-family:Poppins,Inter,sans-serif;font-weight:700;font-size:17px;flex:1;min-width:150px}
.bd-top .day::first-letter{text-transform:uppercase}
.bd-sum{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px}
@media (max-width:980px){.bd-sum{grid-template-columns:repeat(3,1fr)}}
@media (max-width:640px){.bd-sum{grid-template-columns:repeat(2,1fr)}}
.bd-sum .kpi{padding:9px 12px} .bd-sum .kpi .v{font-size:20px}
/* Capital del día (tablero) */
.bd-cap{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:8px;margin-bottom:8px}
@media (max-width:640px){.bd-cap{grid-template-columns:1fr 1fr}.bd-cap .hero{grid-column:1/-1}}
.bd-cap .kpi{padding:10px 14px}
.bd-cap .hero{background:linear-gradient(135deg,#17803d,#1F9D57);border:0;color:#fff}
.bd-cap .hero .l,.bd-cap .hero .s{color:rgba(255,255,255,.9)}
.bd-cap .hero .v{font-size:34px;line-height:1.1;margin-top:4px}
.bd-cap .hero .bar{height:7px;border-radius:4px;background:rgba(255,255,255,.28);margin-top:8px;overflow:hidden}
.bd-cap .hero .bar i{display:block;height:100%;background:#FFD400;border-radius:4px}
.bd-cap .sec .v{font-size:19px;color:var(--ink2)}
.bd-sum .kpi.prom .v{color:var(--green)}
.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;align-items:start}
@media (max-width:980px){.board{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px 8px;-webkit-overflow-scrolling:touch}
  .board .col{flex:0 0 84vw;max-width:360px;scroll-snap-align:start}}
.col{background:var(--brand2);border-radius:16px;padding:8px;min-height:120px}
.col-h{display:flex;align-items:center;gap:8px;padding:6px 6px 10px;border-bottom:3px solid var(--cc);margin-bottom:8px}
.col-h > div{flex:1;min-width:0}
/* Ubicación para verificación */
.ubi{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px}
.ubi .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700}
.ubi .hd a{font-weight:600;font-size:12.5px}
.ubi .prev{font-size:12px;margin-top:4px}
.loc{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:12.5px;color:var(--ink2);margin-top:5px}
.loc a{font-weight:600}
.loc .km{font-weight:700;color:var(--brand-dk)}
.loc .sin{color:var(--amber)}
.vtool{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 10px}
.vtool .seg{flex:none}
.vtool select{width:auto;min-width:170px;padding:7px 10px}
.grp{font:700 13px/1.2 Poppins,Inter,sans-serif;color:var(--ink2);margin:14px 2px 6px;display:flex;gap:8px;align-items:center}
.grp span{font:600 11.5px Inter,sans-serif;color:var(--muted)}
.parada{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;border-radius:11px;background:var(--brand);color:#fff;font:700 12px Inter,sans-serif;padding:0 6px}
#vMap{height:62vh;min-height:360px;border-radius:14px;border:1px solid var(--line);overflow:hidden;z-index:0}
.asig{display:flex;gap:6px;align-items:center;margin-top:6px;font-size:12.5px}
.asig select{width:auto;padding:4px 8px;font-size:12.5px}
.col-h b{font-size:14.5px;flex:1}
.col-h .cnt{background:var(--card);border-radius:999px;padding:1px 9px;font-weight:700;font-size:13px}
.col-body{display:flex;flex-direction:column;gap:8px;max-height:calc(100dvh - 300px);overflow-y:auto}
@media (max-width:980px){.col-body{max-height:none}}
.kc{background:var(--card);border-radius:12px;padding:10px 11px;box-shadow:var(--shadow);border:1px solid var(--line);border-left:4px solid var(--kc,var(--line));cursor:pointer}
.kc .nm{font-weight:650;font-size:14.5px;line-height:1.25}
/* Solicitud en espera: tarjeta en gris */
.espera{--rc:var(--gray)!important;--rb:var(--gray-bg)!important;--kc:var(--gray)!important;background:var(--gray-bg)!important;border-left-color:var(--gray)!important}
.espera .chip,.espera .rol,.espera .tm span{filter:grayscale(1)}
.espera .nm,.espera .name{color:var(--ink2)}
.kc .ln{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:12px;color:var(--ink2);margin-top:5px}
.kc .tm{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.tm span{font-size:11.5px;font-weight:650;padding:2px 7px;border-radius:7px;background:var(--gray-bg);color:var(--ink2);font-variant-numeric:tabular-nums}
.tm .warn{background:var(--amber-bg);color:var(--amber)} .tm .late{background:var(--red-bg);color:var(--red)} .tm .good{background:var(--green-bg);color:var(--green)}
.col .empty{padding:18px 6px;font-size:13px}
/* Línea de tiempos */
.steps{position:relative}
.stp{display:grid;grid-template-columns:18px 1fr auto;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.stp:last-child{border-bottom:0}
.stp > i{width:12px;height:12px;border-radius:50%;margin-top:4px;background:var(--brand)}
.stp .d{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.stp .d small{display:block;font-weight:500;color:var(--muted)}
.stp.now > i{background:var(--accent);box-shadow:0 0 0 3px rgba(255,212,0,.35)}
.rol{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px 3px 7px;border-radius:999px;background:var(--rb);color:var(--rc);white-space:nowrap}
.rol:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--rc)}
.kc{border-left-color:var(--rc)!important} .kc .rolbar{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:6px}
.sol{border-left:5px solid var(--rc,var(--line))}
.leyenda{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.pasos{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.pasos span{font-size:11px;font-weight:600;padding:2px 7px 2px 6px;border-radius:6px;background:var(--rb);color:var(--rc);border-left:3px solid var(--rc);font-variant-numeric:tabular-nums;white-space:nowrap}
.pasos span.cur{outline:1.5px dashed var(--rc);outline-offset:1px}
.pasos span.late{background:var(--red-bg);color:var(--red);border-left-color:var(--red)}
.stp > i{background:var(--rc,var(--brand))!important}
.stp .nota{font-style:italic;color:var(--ink2)}
.stp .pn{display:inline-block;font-size:11.5px;font-weight:700;color:var(--rc);margin-right:4px}
.dif-ok{color:var(--green);font-weight:700} .dif-w{color:var(--amber);font-weight:700} .dif-b{color:var(--red);font-weight:700}
.rf-head{background:linear-gradient(135deg,#1877F2,#0B5AD6);color:#fff;border-radius:12px;padding:10px 14px;margin-bottom:10px}
.rf-head .rf-nm{font-family:Poppins,Inter,sans-serif;font-weight:700;font-size:17px;line-height:1.2}
.rf-head .rf-sub{font-size:12.5px;opacity:.92;margin-top:2px}
.dict{border-radius:12px;padding:10px 12px;font-weight:700;margin-top:10px;text-align:center;font-family:Poppins,Inter,sans-serif}
.grid-ch{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:760px){.grid-ch{grid-template-columns:1fr}}
.chart{overflow-x:auto}
.chart svg{min-width:100%}
/* Contrato de línea de crédito: hojas carta */
.dvbox{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px 10px;margin:4px 0 10px}
.dvbox .dv{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline;padding:5px 0;border-bottom:1px dashed var(--line);font-size:13px}
.dvbox .dv:last-child{border-bottom:0}
.dvbox .dv > span:first-child{min-width:100px}
.sheet .card.plegable > h4.sec:first-child{cursor:pointer;user-select:none;display:flex;align-items:center;gap:6px}
.sheet .card.plegable > h4.sec:first-child::after{content:'▾';margin-left:auto;font-size:14px;color:var(--muted);transition:transform .15s}
.sheet .card.plegada > h4.sec:first-child{margin-bottom:0}
.sheet .card.plegada > h4.sec:first-child::after{transform:rotate(-90deg)}
.sheet .card.plegada > :not(:first-child){display:none!important}
.ct-pages{display:flex;flex-direction:column;gap:18px;align-items:center}
.ct-page{width:8.5in;height:11in;background:#fff;color:#000;box-shadow:0 4px 18px rgba(0,0,0,.18);position:relative;overflow:hidden;font-family:Arial,Helvetica,sans-serif;font-size:9.2pt;line-height:1.27}
.ct-page .hd{position:absolute;top:.35in;left:.75in;right:.75in;display:flex;align-items:center;justify-content:space-between;border-bottom:1.2pt solid #1877F2;padding-bottom:6pt}
.ct-page .hd img{height:.55in}
.ct-page .hd .rt{font-size:8pt;color:#0A2A66;text-align:right;line-height:1.3}
.ct-page .bd{position:absolute;top:1.15in;left:.75in;right:.75in;bottom:.62in}
.ct-page .ft{position:absolute;bottom:.32in;left:.75in;right:.75in;font-size:8pt;color:#555;display:flex;justify-content:space-between;border-top:.6pt solid #ccc;padding-top:4pt}
.ct-page h1{font-size:12pt;text-align:center;font-weight:700;margin:0 0 10pt;letter-spacing:.3pt}
.ct-page p{margin:0 0 5.5pt;text-align:justify}
.ct-page .f{font-weight:700;text-decoration:underline}
.ct-page .firmas{display:grid;grid-template-columns:1fr 3.45in;gap:.3in;margin-top:54pt;align-items:start}
.ct-page .fcol{display:flex;flex-direction:column;gap:22pt}
.ct-page .fila{display:grid;grid-template-columns:1fr .95in;gap:.18in;align-items:end}
.ct-page .firma{text-align:center}
.ct-page .firma .ln{border-top:1pt solid #000;padding-top:4pt;font-weight:700}
.ct-page .firma .sm{font-size:8.6pt;margin-top:2pt}
.ct-page .huella{height:1.05in;border:1pt solid #000;border-radius:4pt;position:relative}
.ct-page .huella span{position:absolute;bottom:-14pt;left:0;right:0;text-align:center;font-size:8pt}
.ct-page .dni{height:2.18in;border:1.2pt dashed #000;border-radius:10pt;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:11pt;color:#444}
.ct-page .acre{margin-top:34pt}
.ct-page .bl{display:inline-block;width:1.4in;border-bottom:.8pt solid #000;height:9pt;vertical-align:baseline}
@media print{.ct-pages{gap:0}.ct-page{box-shadow:none;page-break-after:always}}
/* Reconocimiento de deuda: hoja carta idéntica al formato */
.rd-wrap{position:fixed;inset:0;z-index:55;background:#dfe4ea;overflow:auto;display:flex;flex-direction:column}
@media (prefers-color-scheme: dark){.rd-wrap{background:#0b1426}}
.rd-bar{position:sticky;top:0;z-index:2;background:var(--card);border-bottom:1px solid var(--line);padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.rd-bar .t{flex:1 1 100%;display:flex;align-items:center;gap:8px;font-weight:700}
.rd-bar .fld{display:flex;flex-direction:column;gap:3px;min-width:130px;flex:1}
.rd-bar .fld label{font-size:11px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.3px}
.rd-bar .fld input{padding:8px 10px}
.rd-bar .acc{display:flex;gap:8px;flex-wrap:wrap}
.rd-stage{padding:16px;display:flex;justify-content:center}
.rd-scaler{transform-origin:top left}
.rd-page{position:relative;width:8.5in;height:11in;background:#fff;color:#000;font-family:Calibri,Carlito,"Segoe UI",Arial,sans-serif;font-size:10pt;line-height:12.2pt;box-shadow:0 1px 3px rgba(0,0,0,.15),0 10px 30px rgba(0,0,0,.10);overflow:hidden}
.rd-page .border{position:absolute;left:24pt;top:24pt;right:24pt;bottom:24pt;border:.5pt solid #000;box-shadow:1.5pt 1.5pt 0 #000}
.rd-page .content{position:absolute;left:.75in;right:.75in;top:1in}
.rd-page p{margin:0;text-align:justify}
.rd-page .title{text-align:center;font-size:12pt;line-height:14.6pt;font-weight:700;text-decoration:underline}
.rd-page b,.rd-page .b{font-weight:700}
.rd-page .bu{font-weight:700;text-decoration:underline}
.rd-page .u{text-decoration:underline}
.rd-page .big{font-size:12pt;line-height:14.6pt}
.rd-page .sig{position:relative;height:calc(14 * 12.2pt)}
.rd-page .sig .ln{position:absolute;white-space:pre}
.rd-page .huella{position:absolute;border:.75pt solid #000;border-radius:8pt;background:#fff}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:92vw;box-shadow:0 4px 16px rgba(0,0,0,.3)}
.toast.err{background:var(--red);color:#fff}
.login{max-width:380px;margin:9vh auto;padding:0 16px}
.login .logo{font-size:26px;font-weight:800;color:var(--brand);text-align:center;margin-bottom:4px}
.login p.s{text-align:center;color:var(--ink2);margin-top:0}
.banner{position:sticky;top:52px;z-index:3;margin:0 0 10px}
.muted{color:var(--muted)} .small{font-size:12.5px}
.row{display:flex;gap:8px;align-items:center}
.spacer{flex:1}
</style>
</head>

// ================== Cálculo (réplica exacta del Excel "Análisis de ingresos") ==================
function calcular(ingresos, tipoPago, rubro){
  const P = S.params;
  const sal = ingresos.filter(i => i.categoria === 'salario').map(i => +i.monto);
  const com = ingresos.filter(i => i.categoria === 'comision').map(i => +i.monto);
  const avg = a => a.length ? a.reduce((x,y) => x+y, 0) / a.length : 0;
  const factor = tipoPago === 'Quincenal' ? P.factor_quincenal : tipoPago === 'Semanal' ? P.factor_semanal : 1;
  const r = P.redondeo || 1000;
  const bruto = avg(sal) * factor + avg(com);
  const promedio = Math.sign(bruto) * Math.round(Math.abs(bruto) / r) * r;  // MROUND
  const techo = rubro ? P.techo_rubro_especial : P.techo_regular;
  let limite, motivo;
  if (promedio === 0){ limite = 0; motivo = 'Sin ingresos registrados.'; }
  else if (promedio < (P.tipob_ingreso_min ?? 10000)){ limite = null; motivo = 'Ingresos insuficientes.'; }
  else if (promedio < P.ingreso_minimo){ limite = Math.min(P.tipob_limite ?? 5000, Math.floor(promedio * P.porcentaje_limite / 1000) * 1000);
    motivo = `Cliente tipo B por ingreso: tasa ${+((P.tipob_tasa ?? 0.2) * 100).toFixed(2)}% nivelado, máximo ${L(P.tipob_limite ?? 5000)}, plazo ${P.tipob_plazo ?? 3} meses.`; }
  else {
    limite = Math.min(techo, Math.floor(promedio * P.porcentaje_limite / 1000) * 1000);  // ROUNDDOWN(-3)
    motivo = promedio * P.porcentaje_limite > techo
      ? (rubro ? 'Política de límite máximo por rubro aplicada.' : 'Política de límite máximo aplicada.')
      : `Aplica límite regular de ${Math.round(P.porcentaje_limite*100)}%.`;
  }
  let aumento = null;
  if (promedio >= P.ingreso_minimo){
    if (rubro) aumento = 'NO ELEGIBLE';
    else { const d = new Date(hoyHN()+'T12:00'); d.setMonth(d.getMonth()+3); aumento = fDate(d); }
  }
  const tipoB = promedio >= (P.tipob_ingreso_min ?? 10000) && promedio < P.ingreso_minimo;
  return { promedio, limite, motivo, tasaPref: !tipoB && promedio > P.umbral_tasa_preferencial, aumento, tipoB,
    insuficiente: promedio > 0 && promedio < (P.tipob_ingreso_min ?? 10000), nSal: sal.length, nCom: com.length, promPago: avg(sal), factor };
}

// Revisa si hay una versión nueva publicada (al abrir, al volver a la app y cada 2 minutos).
// Si la hay, recarga sola en un momento seguro: sin diálogos abiertos, sin cambios sin guardar y sin estar escribiendo.
// Los cambios pendientes de enviar están guardados en el teléfono, así que no se pierden al recargar.
const UPD = { firma: null, nueva: null, revisando: false, timer: null };
async function revisarVersion(){
  if (UPD.revisando || !navigator.onLine || !/^https?:$/.test(location.protocol)) return;
  UPD.revisando = true;
  try {
    const url = location.pathname.replace(/[^/]*$/, '') + 'index.html';
    // 1) consulta liviana (solo encabezados); 2) si cambió, baja el archivo y lee su versión
    let firma = null;
    try { const h = await fetch(url, { method: 'HEAD', cache: 'no-store' }); if (h.ok) firma = h.headers.get('etag') || h.headers.get('last-modified') || h.headers.get('content-length'); } catch(e){}
    if (firma && UPD.firma === firma && !UPD.nueva) return;
    const r = await fetch(url + '?vc=' + Date.now(), { cache: 'no-store' }); if (!r.ok) return;
    const m = (await r.text()).match(new RegExp('const APP' + "_VER = '([^']+)'"));
    UPD.firma = firma;
    if (m && m[1] !== APP_VER){ UPD.nueva = m[1]; navigator.serviceWorker?.getRegistration?.().then(g => g && g.update()).catch(() => {}); intentarActualizar(); }
  } catch(e){} finally { UPD.revisando = false; }
}
function momentoSeguro(){
  if ((S.dlgs || []).some(w => w.isConnected)) return false;
  if (S.dirty) return false;
  const a = document.activeElement; if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.value) return false;
  return true;
}
function intentarActualizar(forzar){
  if (!UPD.nueva) return;
  if (!forzar && !momentoSeguro()){
    if (!$('#updBar')){
      const b = document.createElement('div'); b.id = 'updBar';
      b.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:9999;background:#0A2A66;color:#fff;border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.25);font-size:13px;max-width:calc(100% - 24px)';
      b.innerHTML = '<span>✨ Hay una versión nueva. Se aplicará al terminar lo que está haciendo.</span><button class="btn sm" style="background:#FFD400;color:#0A2A66;white-space:nowrap" id="updYa">Actualizar ahora</button>';
      document.body.appendChild(b); $('#updYa').onclick = () => intentarActualizar(true);
    }
    clearTimeout(UPD.timer); UPD.timer = setTimeout(() => intentarActualizar(), 8000);
    return;
  }
  // Evita un ciclo de recargas si el servidor todavía entrega la copia anterior
  try { const prev = JSON.parse(localStorage.getItem('vc_upd_intento') || 'null'); if (prev && prev.ver === UPD.nueva && Date.now() - prev.t < 600000 && !forzar) return; localStorage.setItem('vc_upd_intento', JSON.stringify({ ver: UPD.nueva, t: Date.now() })); } catch(e){}
  try { sessionStorage.setItem('vc_vuelta', JSON.stringify({ tab: S.tab, det: $('#sheet').classList.contains('hidden') ? null : S.det, y: window.scrollY, ver: UPD.nueva })); } catch(e){}
  // Dirección con ?v= para saltarse cualquier copia guardada del navegador
  location.replace(location.pathname + '?v=' + encodeURIComponent(UPD.nueva) + location.hash);
}
function vigilarVersion(){
  if (UPD.iniciado) return; UPD.iniciado = true;
  revisarVersion();
  setInterval(revisarVersion, 120000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) revisarVersion(); else if (UPD.nueva && momentoSeguro()) intentarActualizar(); });
  window.addEventListener('online', revisarVersion);
  window.addEventListener('focus', revisarVersion);
}

// ================== Refinanciar (clientes con disponible) ==================
// Se carga la lista de préstamos y el reporte de cuotas del sistema; si el cliente está al día se calcula
// disponible = límite asignado (o sugerido = capital del último préstamo) − balance total de sus préstamos.
const RF = { corte:null, gest:{}, cargado:false, cargando:false, estado:'disp', gf:'todas', orden:'disp', q:'' };
const rfKey = n => String(n || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim().replace(/\s+/g, ' ').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 180) || 'sin-nombre';
const rfHn = h => String(h || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');
const rfEdita = () => es('analista');            // analista o admin: límite, si aplica, cargar archivos
const rfGestiona = () => es('analista', 'asesor'); // contacto, colocación y comentarios
const rfL0 = n => 'L ' + Math.round(n || 0).toLocaleString('es-HN');
const rfFd = s => { if (!s) return '—'; const [y, m, d] = String(s).slice(0, 10).split('-'); return `${+d} ${MESES_RF[+m - 1]} ${y.slice(2)}`; };
const MESES_RF = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
let rfXlsxP = null;
function rfXlsx(){
  return rfXlsxP || (rfXlsxP = new Promise((ok, ko) => {
    if (window.XLSX) return ok(window.XLSX);
    const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = () => ok(window.XLSX); s.onerror = () => { rfXlsxP = null; ko(new Error('No se pudo cargar el lector de Excel. Revise la conexión.')); };
    document.head.appendChild(s);
  }));
}
async function rfCargar(forzar){
  if (RF.cargando || (RF.cargado && !forzar)) return;
  RF.cargando = true;
  try {
    const [c, g] = await Promise.all([
      sb.from('refi_cortes').select('*').order('cargado_en', { ascending:false }).limit(1).maybeSingle(),
      sb.from('refi_clientes').select('*').limit(5000)]);
    if (c.error) throw c.error; if (g.error) throw g.error;
    RF.corte = c.data || null; RF.gest = Object.fromEntries((g.data || []).map(x => [x.clave, x])); RF.cargado = true;
    KV.set(ck('refi'), { corte:RF.corte, gest:RF.gest });
  } catch(e){
    const k = await KV.get(ck('refi'));
    if (k){ RF.corte = k.corte; RF.gest = k.gest; RF.cargado = true; toast(esRed(e) ? 'Sin señal: mostrando la última copia guardada' : errMsg(e), !esRed(e)); }
    else toast(esRed(e) ? 'Sin señal: esta sección necesita conexión la primera vez' : errMsg(e), true);
  } finally { RF.cargando = false; }
}
function rfCalcular(){
  const c = RF.corte; if (!c) return { rows:[], st:null };
  const P = S.params, minimo = P.disponible_minimo ?? 2000, tol = P.refi_tolerancia ?? 1;
  const nivCompleto = P.refi_nivelado_completo === 1, ignorarCorte = P.refi_ignorar_corte === 1;
  const loans = {}, pend = {};
  for (const p of c.prestamos || []){ const k = rfKey(p.c); (loans[k] = loans[k] || []).push(p); }
  for (const q of c.cuotas || []){
    if (ignorarCorte && c.fecha_corte && q.f >= c.fecha_corte) continue;
    const niv = String(q.m || '').toUpperCase().startsWith('NIVELADO');
    const v = niv && !nivCompleto ? Math.max(0, (q.bal || 0) - (q.cap || 0)) : (q.bal || 0);
    const k = rfKey(q.c), o = pend[k] = pend[k] || { monto:0, n:0, max:0, list:[] };
    o.list.push({ ...q, pend:v });
    if (v > 0.004){ o.monto += v; o.n++; o.max = Math.max(o.max, q.atr || 0); }
  }
  // Solicitud de refinanciamiento/reingreso más reciente del cliente (para no duplicar gestiones)
  const sols = {};
  for (const s of S.sols) if (s.tipo !== 'nuevo' && s.id > 0){ const k = rfKey(s.nombre_cliente); if (!sols[k]) sols[k] = s; }
  const hoyD = new Date(hoyHN() + 'T12:00'), mesesAum = P.refi_meses_aumento ?? 3;
  const antig = f => { if (!f) return null; const d0 = new Date(String(f).slice(0, 10) + 'T12:00'); if (isNaN(d0)) return null;
    const lim = new Date(d0); lim.setMonth(lim.getMonth() + mesesAum);
    const dias = Math.max(0, Math.round((hoyD - d0) / 864e5)); return { dias, meses:Math.floor(dias / 30.44), cumple:lim <= hoyD }; };
  const rows = [];
  for (const k in loans){
    const ls = loans[k].slice().sort((a, b) => String(b.f || '').localeCompare(String(a.f || '')) || (b.cap - a.cap));
    const u = ls[0], balance = ls.reduce((a, x) => a + (x.bal || 0), 0);
    const g = RF.gest[k] || {}, pd = pend[k] || { monto:0, n:0, max:0, list:[] };
    const atraso = pd.monto > tol;
    const limG = g.limite == null ? null : Number(g.limite);
    const base = limG ?? u.cap, bruto = base - balance, disp = bruto >= minimo ? bruto : 0;
    const noAplica = g.aplica === 'no', elegible = !atraso && disp > 0 && !noAplica;
    const sol = sols[k] && (!CERRADAS.includes(sols[k].estado) || new Date(sols[k].creado_en) >= new Date(Date.now() - 45 * 864e5)) ? sols[k] : null;
    const an = antig(u.f), aumento = !!an && an.cumple && !atraso && !noAplica && g.nivel !== 100;
    rows.push({ k, nombre:u.c, tipo:u.t, dia:u.dia, fecha:u.f, capital:u.cap, nPrest:ls.length, prest:ls, balance, pd, atraso, limG, sugerido:u.cap, bruto, disp, elegible, noAplica, g, sol, an, aumento });
  }
  const st = { clientes:rows.length, prestamos:(c.prestamos || []).length, alDia:0, atraso:0, opN:0, opM:0, conN:0, conM:0, colN:0, colM:0, porN:0, porM:0, sugN:0, revN:0, aumN:0, menosN:0, modal:{} };
  for (const r of rows){
    r.atraso ? st.atraso++ : st.alDia++;
    if (r.aumento) st.aumN++; if (r.an && !r.an.cumple) st.menosN++;
    if (r.elegible){
      st.opN++; st.opM += r.disp; if (r.limG == null) st.sugN++; if (!r.g.aplica) st.revN++;
      const m = st.modal[r.tipo || 'Otro'] = st.modal[r.tipo || 'Otro'] || { n:0, m:0 }; m.n++; m.m += r.disp;
      if (r.g.contactado || r.g.colocado){ st.conN++; st.conM += r.disp; }
      if (!r.g.colocado){ st.porN++; st.porM += r.disp; }
    }
    if (r.g.colocado){ st.colN++; st.colM += Number(r.g.monto_colocado) || 0; }
  }
  return { rows, st };
}

function rfFiltrar(rows){
  const q = RF.q.trim() ? rfKey(RF.q).replace(/-/g, ' ') : '';
  const out = rows.filter(r => {
    if (RF.estado === 'disp' && !r.elegible) return false;
    if (RF.estado === 'aldia' && r.atraso) return false;
    if (RF.estado === 'atraso' && !r.atraso) return false;
    const g = r.g;
    switch (RF.gf){
      case 'sin': if (g.contactado || g.colocado) return false; break;
      case 'contactado': if (!g.contactado) return false; break;
      case 'colocado': if (!g.colocado) return false; break;
      case 'revisar': if (g.aplica) return false; break;
      case 'si': if (g.aplica !== 'si') return false; break;
      case 'no': if (g.aplica !== 'no') return false; break;
      case 'sugerido': if (r.limG != null) return false; break;
      case 'aumento': if (!r.aumento) return false; break;
      case 'menos': if (!r.an || r.an.cumple) return false; break;
    }
    return !q || rfKey(r.nombre).replace(/-/g, ' ').includes(q);
  });
  const by = { disp:(a, b) => b.disp - a.disp || b.bruto - a.bruto, nombre:(a, b) => a.nombre.localeCompare(b.nombre, 'es'), balance:(a, b) => b.balance - a.balance,
    fecha:(a, b) => String(a.fecha || '').localeCompare(String(b.fecha || '')), atraso:(a, b) => b.pd.max - a.pd.max || b.pd.monto - a.pd.monto, antig:(a, b) => (b.an?.dias ?? -1) - (a.an?.dias ?? -1) };
  return out.sort(by[RF.orden] || by.disp);
}

// ----- Carga de archivos del sistema -----
function rfISO(v){
  if (v == null || v === '') return null;
  if (v instanceof Date && !isNaN(v)) return `${v.getFullYear()}-${String(v.getMonth() + 1).padStart(2, '0')}-${String(v.getDate()).padStart(2, '0')}`;
  if (typeof v === 'number' && window.XLSX){ const d = XLSX.SSF.parse_date_code(v); if (d) return `${d.y}-${String(d.m).padStart(2, '0')}-${String(d.d).padStart(2, '0')}`; }
  const s = String(v).trim(); let m;
  if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
  if ((m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/))) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
  return null;
}
const rfNum = v => typeof v === 'number' ? v : (num(v) ?? 0);
async function rfLeerArchivo(file){
  const X = await rfXlsx();
  const wb = X.read(await file.arrayBuffer(), { type:'array', cellDates:true });
  for (const sn of wb.SheetNames){
    const a = X.utils.sheet_to_json(wb.Sheets[sn], { header:1, raw:true, defval:null });
    let hi = -1, idx = {};
    for (let i = 0; i < Math.min(a.length, 30); i++){ const h = (a[i] || []).map(rfHn); if (h.includes('cliente')){ hi = i; h.forEach((x, j) => { if (x && !(x in idx)) idx[x] = j; }); break; } }
    if (hi < 0) continue;
    const rows = a.slice(hi + 1).filter(r => r && r[idx.cliente] != null && String(r[idx.cliente]).trim() !== '');
    const pk = (r, ...ns) => { for (const n of ns) if (n in idx) return r[idx[n]]; return null; };
    if ('fechacuota' in idx || 'atrasodias' in idx){
      const m = file.name.match(/(\d{4}-\d{2}-\d{2})\D*\.\w+$/);
      return { kind:'cuotas', name:file.name, fechaCorte:m ? m[1] : null, data:rows.map(r => ({ c:String(pk(r, 'cliente')).trim(), m:String(pk(r, 'modalidad', 'tipo') || ''), f:rfISO(pk(r, 'fechacuota', 'fecha')),
        cap:rfNum(pk(r, 'capital')), i:rfNum(pk(r, 'interes')), bal:rfNum(pk(r, 'balance')), atr:Math.round(rfNum(pk(r, 'atrasodias', 'atraso', 'dias'))) })) };
    }
    if ('nuevolimite' in idx || 'limite' in idx){
      return { kind:'limites', name:file.name, data:rows.map(r => { const lv = pk(r, 'nuevolimite', 'limite');
        const com = [pk(r, 'comentarios', 'comentario'), pk(r, 'otrasnotas')].filter(x => x != null && String(x).trim() !== '').join(' · ');
        return { c:String(pk(r, 'cliente')).trim(), lim:lv == null || lv === '' ? null : rfNum(lv), com }; }).filter(x => x.lim !== null || x.com) };
    }
    if ('capital' in idx && 'balance' in idx && ('tipo' in idx || 'diaspago' in idx || 'balancecuotas' in idx)){
      return { kind:'prestamos', name:file.name, data:rows.map(r => ({ c:String(pk(r, 'cliente')).trim(), t:String(pk(r, 'tipo', 'modalidad') || ''), f:rfISO(pk(r, 'fecha', 'fechainicio')),
        cap:rfNum(pk(r, 'capital')), bal:rfNum(pk(r, 'balance')), dia:String(pk(r, 'diaspago') || ''), cart:String(pk(r, 'cartera') || '') })) };
    }
  }
  return { kind:'desconocido', name:file.name, data:[] };
}
function rfDialogoCarga(){
  const KIND = { prestamos:['Lista de préstamos','c-green'], cuotas:['Reporte de cuotas','c-blue'], limites:['Límites y comentarios anteriores','c-amber'], desconocido:['No reconocido','c-red'] };
  let staged = [];
  const w = dialogo(`<h3>Cargar archivos del sistema</h3>
    <div class="small muted">Suba la <b>lista de préstamos</b> y el <b>reporte de cuotas</b> pendientes. Opcional: un Excel anterior con la columna NUEVO LIMITE para traer límites y comentarios. El tipo de cada archivo se detecta solo.</div>
    <label class="btn ghost" style="display:block;text-align:center;margin-top:10px">📎 Elegir archivos<input id="rfFiles" type="file" accept=".xlsx,.xls,.csv" multiple hidden></label>
    <div id="rfStaged" style="margin-top:8px"></div>
    <div class="btns"><button class="btn ghost" data-close>Cancelar</button><button class="btn pri" id="rfProc" disabled>Procesar</button></div>`);
  const has = k => staged.some(f => f.kind === k);
  const pintarSt = () => {
    w.querySelector('#rfStaged').innerHTML = staged.map((f, i) => `<div class="ob-item row" style="justify-content:space-between;flex-wrap:wrap"><span style="word-break:break-all"><b>${esc(f.name)}</b><br><span class="chip ${KIND[f.kind][1]}">${KIND[f.kind][0]}</span> <span class="small muted">${f.data.length} filas</span></span><button class="btn sm ghost" data-rm="${i}">Quitar</button></div>`).join('');
    w.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { staged.splice(+b.dataset.rm, 1); pintarSt(); });
    const ok = (has('prestamos') && has('cuotas')) || has('limites'), btn = w.querySelector('#rfProc');
    btn.disabled = !ok;
    btn.textContent = has('prestamos') && has('cuotas') ? (has('limites') ? 'Guardar corte e importar límites' : 'Guardar corte nuevo') : has('limites') ? 'Importar límites' : has('prestamos') ? 'Falta el reporte de cuotas' : has('cuotas') ? 'Falta la lista de préstamos' : 'Procesar';
  };
  w.querySelector('#rfFiles').onchange = async e => {
    const files = [...e.target.files]; e.target.value = '';
    for (const f of files){
      try { const p = await rfLeerArchivo(f); staged = staged.filter(x => x.kind !== p.kind || p.kind === 'desconocido'); staged.push(p); }
      catch(err){ toast(errMsg(err), true); staged.push({ kind:'desconocido', name:f.name, data:[] }); }
    }
    pintarSt();
  };
  w.querySelector('#rfProc').onclick = e => run(e.target, async () => {
    const P = staged.find(f => f.kind === 'prestamos'), C = staged.find(f => f.kind === 'cuotas'), Lm = staged.find(f => f.kind === 'limites');
    if (P && C){
      const { error } = await sb.from('refi_cortes').insert({ fecha_corte:C.fechaCorte || hoyHN(), archivos:{ prestamos:P.name, cuotas:C.name }, prestamos:P.data, cuotas:C.data });
      if (error) throw error;
    }
    let imp = 0;
    if (Lm){
      const rows = [];
      for (const x of Lm.data){
        const k = rfKey(x.c), g = RF.gest[k] || {}, row = { clave:k, nombre:g.nombre || x.c };
        if (g.limite == null && x.lim !== null) row.limite = x.lim;
        if (!g.comentario && x.com) row.comentario = x.com;
        if (Object.keys(row).length > 2 && !rows.some(y => y.clave === k)) rows.push(row);
      }
      // upsert por grupos con las mismas columnas
      for (const cols of ['limite,comentario', 'limite', 'comentario']){
        const grp = rows.filter(r => Object.keys(r).filter(c => c !== 'clave' && c !== 'nombre').sort().join(',') === cols);
        if (grp.length){ const { error } = await sb.from('refi_clientes').upsert(grp, { onConflict:'clave' }); if (error) throw error; imp += grp.length; }
      }
    }
    await cerrarDialogo(w);
    await rfCargar(true); rfPintar();
    toast(P && C ? `Corte guardado: ${P.data.length} préstamos y ${C.data.length} cuotas${Lm ? ` · ${imp} límites importados` : ''}` : `${imp} cliente(s) actualizados con límites o comentarios`);
  });
}

  let extra = '';
  if (S.tab === 'todas'){
    const fs = [['abiertas','Abiertas'],['espera','⏸ En espera'],['todas','Todas'],...Object.entries(EST).map(([k,v]) => [k, v.t])];

async function mapaVerificar(pts){
  const el = $('#vMap'); if (!el) return;
  try {
    if (!window.L){
      if (!document.querySelector('link[data-leaflet]')){ const l = document.createElement('link'); l.rel = 'stylesheet'; l.dataset.leaflet = 1; l.href = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css'; document.head.appendChild(l); }
      await cargarScript('https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js');
    }
  } catch(e){ el.innerHTML = `<div class="empty">${esc(errMsg(e))}</div>`; return; }
  if (!$('#vMap')) return;
  const LF = window.L; // Leaflet (L ya se usa para formatear lempiras)
  const map = LF.map(el, { zoomControl:true }).setView([15.5, -88.03], 12);
  LF.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19, attribution:'© OpenStreetMap' }).addTo(map);
  const b = [];
  pts.forEach(s => { const p = puntoVerif(s); b.push([p.lat, p.lng]);
    const col = s.verificador_id ? avColor(s.verificador_id) : '#6b7280';
    LF.circleMarker([p.lat, p.lng], { radius:10, color:'#fff', weight:2, fillColor:col, fillOpacity:.95 }).addTo(map)
      .bindPopup(`<b>${esc(s.nombre_cliente)}</b><br>${esc(s.codigo)} · ${esc([sectorDe(s), ciudadDe(s)].filter(Boolean).join(', '))}<br>Verificador: ${esc(s.verificador_id ? nombre(s.verificador_id) : 'Sin asignar')}${s.forma_desembolso === 'efectivo' ? `<br>💵 Entregar ${L(montoLibre(s))}` : ''}<br><a href="#" data-open="${s.id}">Abrir solicitud</a> · <a href="${linkRuta(p.lat, p.lng)}" target="_blank">Cómo llegar</a>`); });
  if (S.miPos){ b.push([S.miPos.lat, S.miPos.lng]); LF.circleMarker([S.miPos.lat, S.miPos.lng], { radius:8, color:'#0A2A66', weight:3, fillColor:'#FFD400', fillOpacity:1 }).addTo(map).bindPopup('Usted está aquí'); }
  if (S.vOrden === 'cerca' && pts.length > 1){ const r = rutaCercana(S.miPos || null, pts);
    LF.polyline((S.miPos ? [[S.miPos.lat, S.miPos.lng]] : []).concat(r.out.map(x => { const p = puntoVerif(x.s); return [p.lat, p.lng]; })), { color:'#1877F2', weight:3, opacity:.6, dashArray:'6 6' }).addTo(map); }
  if (b.length) map.fitBounds(b, { padding:[30,30], maxZoom:15 });
  el.addEventListener('click', e => { const a = e.target.closest('[data-open]'); if (a){ e.preventDefault(); abrirDetalle(+a.dataset.open); } });
  // Leyenda de verificadores
  const vs = [...new Set(pts.map(s => s.verificador_id || ''))];
  const leg = LF.control({ position:'bottomleft' });
  leg.onAdd = () => { const d = LF.DomUtil.create('div'); d.style.cssText = 'background:#fff;padding:6px 8px;border-radius:8px;font:12px Inter,sans-serif;box-shadow:0 1px 4px rgba(0,0,0,.2)';
    d.innerHTML = vs.map(v => `<div><span style="display:inline-block;width:10px;height:10px;border-radius:5px;background:${v ? avColor(v) : '#6b7280'};margin-right:5px"></span>${esc(v ? nombre(v) : 'Sin asignar')}</div>`).join(''); return d; };
  leg.addTo(map);
}

function cerrarDialogo(w, fromPop){ if (!w.isConnected) return Promise.resolve(); w.remove(); S.dlgs = (S.dlgs||[]).filter(x => x !== w); return fromPop ? Promise.resolve() : histBack(); }

// ================== Coincidencias ==================
const norm = s => (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
function coincidencias(s){
  const n = norm(s.nombre_cliente), tel = (s.telefono||'').replace(/\D/g,''), dni = (s.dni||'').replace(/\D/g,'');
  if (n.length < 5 && !tel && !dni) return '';
  const hits = S.sols.filter(o => o.id !== s.id).map(o => {
    const r = [];
    if (n.length >= 5 && norm(o.nombre_cliente) === n) r.push('mismo nombre');
    if (tel.length >= 8 && (o.telefono||'').replace(/\D/g,'') === tel) r.push('mismo teléfono');
    if (dni.length >= 8 && (o.dni||'').replace(/\D/g,'') === dni) r.push('mismo DNI');
    return r.length ? { o, r } : null;
  }).filter(Boolean);
  if (!hits.length) return '';
  return `<div class="alert warn small"><b>Coincidencias:</b><br>${hits.slice(0,6).map(h =>
    `${esc(h.o.codigo)} · ${esc(h.o.nombre_cliente)} · ${EST[h.o.estado].t} (${h.r.join(', ')})`).join('<br>')}</div>`;
}

async function abrirDetalle(id, keepScroll){
  const s = S.sols.find(x => x.id === id); if (!s) return;
  S.det = id; S.replyTo = null; S.dirty = false;
  if ($('#sheet').classList.contains('hidden')){ $('#sheet').classList.remove('hidden'); history.pushState({ sheet:1 }, ''); document.body.style.overflow = 'hidden'; }
  $('#sheetTitle').textContent = s.nombre_cliente; $('#sheetChip').innerHTML = chip(s.estado);
  if (!keepScroll){ $('#sheetBody').innerHTML = '<div class="empty">Cargando…</div>'; $('#sheet').scrollTop = 0; }
  let ing = { error:{ message:'Failed to fetch' } }, items = ing, evs = ing;
  if (id > 0 && navigator.onLine) [ing, items, evs] = await Promise.all([
    sb.from('ingresos').select('*').eq('solicitud_id', id).order('fecha'),
    sb.from('verificacion_items').select('*').eq('solicitud_id', id).order('id'),
    sb.from('eventos').select('*').eq('solicitud_id', id).order('creado_en')
  ]);
  if (S.det !== id) return;
  if (!ing.error && !items.error && !evs.error){ S.detCache[id] = { ing: ing.data||[], items: items.data||[], evs: evs.data||[] }; aplicarPendientes(); guardarCache(); }
  else if (id > 0 && esRed(ing.error || items.error || evs.error)) marcarConexion(false);
  const dc = S.detCache[id] || { ing:[], items:[], evs:[] };
  S.detData = { s: S.sols.find(x => x.id === id) || s, ing: dc.ing, items: dc.items, evs: dc.evs };
  const y = $('#sheet').scrollTop;
  renderDetalle();
  if (keepScroll) $('#sheet').scrollTop = y;
  cargarComentarios();
}
function cerrarDetalle(fromPop){
  if ($('#sheet').classList.contains('hidden')) return;
  if (S.dirty && !confirm('Hay datos sin enviar. ¿Salir de todos modos?')){ if (fromPop) history.pushState({ sheet:1 }, ''); return; }
  $('#sheet').classList.add('hidden'); document.body.style.overflow = ''; S.det = null; S.dirty = false;
  pintarTabs(); pintar();
  if (!fromPop) return histBack();
}
$('#sheetBack').onclick = () => cerrarDetalle();
window.addEventListener('popstate', () => {
  if (popIgnore > 0){ popIgnore--; return; }
  if (S.dlgs?.length) return cerrarDialogo(S.dlgs[S.dlgs.length-1], true);
  if (!$('#sheet').classList.contains('hidden')) cerrarDetalle(true);
});

const CIUDADES = ['San Pedro Sula','Choloma','Villanueva','La Lima','El Progreso','Puerto Cortés','Otra'];
// Acepta "15.50417, -88.025", enlaces de Google Maps (@lat,lng · q=lat,lng · !3dlat!4dlng) o de WhatsApp
function parseCoords(txt){
  const t = String(txt || '').trim(); if (!t) return null;
  let m = t.match(/!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/) || t.match(/@(-?\d+\.\d+),\s*(-?\d+\.\d+)/)
       || t.match(/[?&](?:q|query|ll|destination|daddr)=(-?\d+\.\d+)(?:,|%2C)\s*(-?\d+\.\d+)/i) || t.match(/(-?\d{1,2}\.\d{3,})\s*[,;\s]\s*(-?\d{1,3}\.\d{3,})/);
  if (!m) return /goo\.gl|maps\.app/i.test(t) ? { corto:true } : null;
  const lat = +m[1], lng = +m[2];
  if (!(Math.abs(lat) <= 90 && Math.abs(lng) <= 180)) return null;
  return { lat, lng, fueraHN: !(lat > 12.9 && lat < 16.6 && lng > -89.5 && lng < -83) };
}
function distKm(a, b){
  const R = 6371, r = x => x * Math.PI / 180, dLa = r(b.lat - a.lat), dLo = r(b.lng - a.lng);
  const h = Math.sin(dLa/2)**2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLo/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const fKm = d => d == null ? '' : d < 1 ? Math.round(d * 1000) + ' m' : d.toFixed(1) + ' km';
// Punto principal a visitar: domicilio; si no tiene, el trabajo
const puntoVerif = s => s.dom_lat != null ? { lat:+s.dom_lat, lng:+s.dom_lng, lugar:'domicilio' } : s.trab_lat != null ? { lat:+s.trab_lat, lng:+s.trab_lng, lugar:'trabajo' } : null;
const sectorDe = s => s.dom_sector || s.trab_sector || s.datos_cliente?.sector || null;
const ciudadDe = s => s.dom_ciudad || s.trab_ciudad || s.datos_cliente?.ciudad || null;
const linkMapa = (lat, lng) => `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;
const linkRuta = (lat, lng) => `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`;
const sectoresConocidos = () => [...new Set(S.sols.flatMap(s => [s.dom_sector, s.trab_sector]).filter(Boolean))].sort();
function miUbicacion(){
  return new Promise((ok, fail) => {
    if (!navigator.geolocation) return fail(new Error('Este dispositivo no permite obtener la ubicación'));
    navigator.geolocation.getCurrentPosition(p => { S.miPos = { lat:p.coords.latitude, lng:p.coords.longitude, t:Date.now() }; ok(S.miPos); },
      e => fail(new Error(e.code === 1 ? 'Permita el acceso a la ubicación en el navegador' : 'No se pudo obtener la ubicación')), { enableHighAccuracy:true, timeout:12000, maximumAge:60000 });
  });
}

function enlazarUbicacion(s, refrescar){
  document.querySelectorAll('#ubiCard .ubi[data-lugar]').forEach(box => {
    const inp = box.querySelector('[data-u="coord"]'), prev = box.querySelector('[data-prev]');

        : c.corto ? '<span style="color:var(--red)">Es un enlace corto: ábralo en Google Maps, mantenga presionado el punto y copie las coordenadas (ej. 15.50417, -88.02500)</span>'

      const sector = box.querySelector('[data-u="sector"]').value, ciudad = box.querySelector('[data-u="ciudad"]').value, ref = box.querySelector('[data-u="ref"]').value;
      await rpc('guardar_ubicacion', { p_id: s.id, p_lugar: box.dataset.lugar, p_lat: c ? c.lat : null, p_lng: c ? c.lng : null, p_sector: sector, p_ciudad: ciudad, p_ref: ref });

// Ruta sugerida: siempre al punto más cercano siguiente (vecino más cercano)
function rutaCercana(origen, items){
  const pend = items.slice(), out = []; let cur = origen, total = 0;
  while (pend.length){
    let bi = 0, bd = Infinity; pend.forEach((x, i) => { const d = cur ? distKm(cur, puntoVerif(x)) : 0; if (d < bd){ bd = d; bi = i; } });
    const x = pend.splice(bi, 1)[0]; const d = cur ? bd : null; if (d) total += d; out.push({ s:x, d }); cur = puntoVerif(x);
  }
  return { out, total };
}

      <label class="f">Monto aprobado</label><input id="dMonto" inputmode="decimal" value="${s.tipo==='nuevo' ? (c.limite || '') : (calcRefi(s, c).limAprob || '')}" placeholder="L">
      ${refi ? `<div class="alert info small" id="dLibre">Monto libre: —</div>` : ''}

// Solicitudes canceladas o rechazadas se pueden repetir (asesor/admin); las del histórico de Excel no traen ingresos
function puedeRepetir(s){ return !!s && es('asesor') && ['denegada','desistida','rechazada_verificacion'].includes(s.estado) && ['nuevo','reingreso','refinanciamiento'].includes(s.tipo) && !(s.id < 0); }
async function repetirSolicitud(s, btn){
  if (!s) return;
  const abierta = S.sols.find(x => x.dni && x.dni === s.dni && !CERRADAS.includes(x.estado));
  const aviso = abierta ? `\n\nOjo: este cliente ya tiene una solicitud abierta (${abierta.codigo}).` : '';
  if (!confirm(`¿Crear una nueva solicitud para ${s.nombre_cliente} con los mismos datos e ingresos de ${s.codigo}?${aviso}`)) return;
  await run(btn, async () => {
    if (!navigator.onLine) throw new Error('Se necesita señal para crear la solicitud a partir de otra');
    const id = await rpc('duplicar_solicitud', { p_id: s.id });
    await cargarSolicitudes(); pintarTabs();
    toast('Solicitud creada en borrador. Revise los ingresos y envíela a análisis.');
    if ($('#sheet').classList.contains('hidden')) pintar();
    S.dirty = false; abrirDetalle(id);
  });
}

// Qué puntos aplican: si el desembolso es por transferencia no hay entrega de efectivo; trabajo solo si se marcó
const itemAplica = (s, it) => it === 'domicilio' ? (s.tipo === 'nuevo' || !!s.actualizar_domicilio) : it === 'trabajo' ? !!s.actualizar_trabajo : it === 'entrega_efectivo' ? s.forma_desembolso === 'efectivo' : true;

  const libre = montoLibre(s);

function enlazarDetalle(s, c){
  const B = $('#sheetBody');
  const refrescar = async () => { await cargarSolicitudes(); const n = S.sols.find(x => x.id === s.id); if (n) { S.dirty=false; await abrirDetalle(s.id, true); } pintarTabs(); };
  enlazarUbicacion(s, refrescar);

  // Ingresos
  let cat = 'salario';
  B.querySelectorAll('#iCat button').forEach(b => b.onclick = () => { cat = b.dataset.v; B.querySelectorAll('#iCat button').forEach(x => x.classList.toggle('on', x===b)); });
  const add = $('#iAdd');
  if (add){
    const go = () => run(add, async () => {
      const m = num($('#iMonto').value); if (!m || m <= 0) throw new Error('Monto inválido');
      if (!$('#iFecha').value) throw new Error('Fecha requerida');
      await dbw({ t:'ins', tabla:'ingresos', row:{ solicitud_id: s.id, fecha: $('#iFecha').value, monto: m, categoria: cat } });
      await recargarIngresos(); setTimeout(() => $('#iMonto')?.focus(), 50);
    });
    add.onclick = go; $('#iMonto').onkeydown = e => { if (e.key === 'Enter') go(); };
  }
  B.querySelectorAll('[data-edi]').forEach(b => b.onclick = () => {
    const ing = S.detData.ing.find(x => x.id === +b.dataset.edi); if (!ing) return;
    const tr = b.closest('tr');
    tr.innerHTML = `<td colspan="3"><div class="addrow" style="margin:0">
      <input type="date" data-e="fecha" value="${ing.fecha}"><input data-e="monto" inputmode="decimal" value="${+ing.monto}">
      <select data-e="categoria"><option value="salario" ${ing.categoria==='salario'?'selected':''}>Salario</option><option value="comision" ${ing.categoria==='comision'?'selected':''}>Comisión</option></select>
      <div class="row"><button class="btn sm pri" data-ok>Guardar</button><button class="btn sm ghost" data-no>✕</button></div></div></td>`;
    tr.querySelector('[data-e="monto"]').focus();
    tr.querySelector('[data-no]').onclick = () => renderDetalleParcial();
    tr.querySelector('[data-ok]').onclick = e => run(e.target, async () => {
      const m = num(tr.querySelector('[data-e="monto"]').value), f = tr.querySelector('[data-e="fecha"]').value;
      if (!m || m <= 0) throw new Error('Monto inválido'); if (!f) throw new Error('Fecha requerida');
      await dbw({ t:'upd', tabla:'ingresos', id: ing.id, sid: s.id, row:{ fecha: f, monto: m, categoria: tr.querySelector('[data-e="categoria"]').value } });
      toast('Ingreso actualizado'); await recargarIngresos();
    });
  });
  B.querySelectorAll('[data-del]').forEach(b => b.onclick = () => run(b, async () => {
    await dbw({ t:'del', tabla:'ingresos', id: +b.dataset.del, sid: s.id }); await recargarIngresos();
  }));
  const updA = () => run(null, async () => {
    await rpc('actualizar_datos_analisis', { p_id: s.id, p_tipo_pago: $('#dPago').value, p_rubro_especial: $('#dRubro').value === '1' });
    s.tipo_pago = $('#dPago').value; s.rubro_especial = $('#dRubro').value === '1'; renderDetalleParcial();
  });
  if ($('#dPago') && !$('#dPago').disabled){ $('#dPago').onchange = updA; $('#dRubro').onchange = updA; }

  enlazarRefi(s);
  if ($('#nvCopiar')) $('#nvCopiar').onclick = async () => {
    const cs = S.detData.s, txt = resumenNuevoWA(cs, calcular(S.detData.ing, cs.tipo_pago, cs.rubro_especial));
    try { await navigator.clipboard.writeText(txt); toast('Resumen copiado. Péguelo en el grupo.'); }
    catch(e){ const w = dialogo(`<h3>Resumen</h3><textarea rows="10" readonly>${esc(txt)}</textarea><div class="btns"><button class="btn pri" data-close>Cerrar</button></div>`); w.querySelector('textarea').select(); }
  };
  if ($('#rdAbrir')) $('#rdAbrir').onclick = () => abrirContrato(S.detData.s);
  if ($('#cfSubir')) $('#cfSubir').onclick = () => abrirContratoFirmado(S.detData.s);
  if ($('#cfThumb') || $('#cfDescargar')) (async () => {
    const cs = S.detData.s, path = cs.contrato_firmado_path; let url = null;
    try { const { data } = await sb.storage.from('evidencias').createSignedUrl(path, 3600); url = data?.signedUrl; } catch(e){}
    const th = $('#cfThumb'); if (th && url){ th.src = url; th.onclick = () => window.open(url, '_blank'); }
    const dl = $('#cfDescargar');
    if (dl) dl.onclick = () => run(dl, async () => {
      if (!url) throw new Error('Se necesita conexión para descargar la foto guardada');
      const b = await (await fetch(url)).blob(); descargarBlob(b, nombreContratoFirmado(cs));
    });
  })();
  if ($('#dAsesor')) $('#dAsesor').onchange = e => run(e.target, async () => { await rpc('reasignar_asesor', { p_id: s.id, p_asesor: e.target.value }); toast('Asesor reasignado'); await refrescar(); });
  // Asesor: enviar
  if ($('#aEnviar')) $('#aEnviar').onclick = e => {
    const nIng = (S.detData.ing || []).length;
    if (!confirm(`¿Confirma que la solicitud de ${s.nombre_cliente} está lista?\n\n${nIng} registro(s) de ingresos.${nIng ? '' : ' ⚠ No tiene ingresos.'}\nSe enviará al analista y ya no podrá editar los ingresos.`)) return;
    run(e.target, async () => { await rpc('enviar_analisis', { p_id: s.id }); toast('Enviada a análisis'); await refrescar(); });
  };

  // Analista
  if ($('#dAprobar')){
    const libre = () => { const m = num($('#dMonto').value)||0, k = +S.detData.s.saldo_capital||0, i = +S.detData.s.saldo_intereses||0;
      if ($('#dLibre')) $('#dLibre').innerHTML = `Monto libre: <b>${L(m - k - i)}</b>${m - k - i < 0 ? ' ⚠ negativo' : ''}`; };
    S.actLibre = libre;
    S.montoTocado = false;
    ['#dMonto'].forEach(q => { if ($(q)) $(q).oninput = () => { S.dirty = true; S.montoTocado = true; libre(); }; }); libre();
    const dict = (btn, tipo) => run(btn, async () => {
      if (tipo === 'aprobada' && c.limite && s.tipo === 'nuevo' && num($('#dMonto').value) > c.limite && !confirm(`El monto supera el límite calculado (${L(c.limite)}). ¿Aprobar de todos modos?`)) return;
      const cs = S.detData.s, rf = cs.tipo !== 'nuevo' ? calcRefi(cs, calcular(S.detData.ing, cs.tipo_pago, cs.rubro_especial)) : null;
      if (tipo === 'aprobada' && s.tipo === 'nuevo' && c.insuficiente && !confirm('Los ingresos están por debajo del mínimo. ¿Aprobar de todos modos?')) return;

function comprimir(file, max = 1280, q = 0.75){
  return new Promise((res, rej) => {
    const img = new Image(); img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement('canvas'); cv.width = img.width * k; cv.height = img.height * k;
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); cv.toBlob(b => b ? res(b) : rej(new Error('No se pudo procesar la foto')), 'image/jpeg', q);
      URL.revokeObjectURL(img.src);
    }; img.onerror = () => rej(new Error('Imagen inválida')); img.src = URL.createObjectURL(file);
  });
}

function enlazarCompletar(s, refrescar){
  const F = $('#cForm'); const nuevo = s.tipo === 'nuevo';
  let forma = s.forma_desembolso || null, verTrab = true;
  const calcLibre = () => {
    const m = num($('#cMonto').value) || 0, ap = +s.monto_aprobado || 0;
    const libre = m - (nuevo ? 0 : (+s.saldo_capital || 0) + (+s.saldo_intereses || 0));
    $('#cLibre').innerHTML = m > ap ? `<span style="color:var(--red);font-size:14px">Excede el aprobado (${L(ap)})</span>`
      : `${L(libre)}${libre < 0 ? ' <span style="color:var(--red);font-size:13px">negativo</span>' : ''}`;
  };
  $('#cMonto').oninput = () => { S.dirty = true; calcLibre(); }; calcLibre();
  const destino = () => {
    const act = !nuevo && ($('#cDom').checked || $('#cTrab').checked);
    const directo = !nuevo && forma === 'transferencia' && !act;
    $('#cVerF').classList.toggle('hidden', directo);
    $('#cDestino').innerHTML = !forma ? 'Seleccione la forma de desembolso.'
      : directo ? '➡ Pasará directo a <b>Desembolsos por transferencia</b> (no requiere verificador).'
      : `➡ Pasará a <b>Verificación</b>${nuevo ? (verTrab ? ' · visitas: domicilio y trabajo' : ' · visita: solo domicilio') : ''}${forma === 'efectivo' ? ' (el verificador entrega el efectivo)' : ''}.${s.dom_lat == null ? '<div class="muted" style="margin-top:4px">Opcional: agregue sector y coordenadas en "Ubicación para verificación" para ordenar las visitas por cercanía. Se puede hacer después.</div>' : ''}`;
  };
  F.querySelectorAll('input,textarea,select').forEach(i => i.addEventListener('input', () => S.dirty = true));
  F.querySelectorAll('#cForma button').forEach(b => b.onclick = () => { forma = b.dataset.v; S.dirty = true;
    F.querySelectorAll('#cForma button').forEach(x => x.classList.toggle('on', x===b)); $('#cCtaF').classList.toggle('hidden', forma !== 'transferencia'); destino(); });
  if (!nuevo){
    $('#cDom').onchange = destino; $('#cTrab').onchange = destino;
  } else {
    F.querySelectorAll('#cVerTipo button').forEach(b => b.onclick = () => { verTrab = b.dataset.v === '1'; S.dirty = true;
      F.querySelectorAll('#cVerTipo button').forEach(x => x.classList.toggle('on', x === b)); destino(); });
    verTrab = !F.querySelector('#cVerTipo button[data-v="0"].on');
  }
  destino();
  $('#cEnviar').onclick = e => run(e.target, async () => {
    if (!forma) throw new Error('Seleccione la forma de desembolso');
    const r = await rpc('completar_solicitud', { p_id: s.id, p_datos: {}, p_forma: forma,
      p_act_domicilio: !nuevo && $('#cDom').checked, p_act_trabajo: nuevo ? verTrab : $('#cTrab').checked, p_act_foto: false,
      p_verificador: $('#cVer').value || null, p_monto_solicitado: (() => { const m = num($('#cMonto').value); if (!m || m <= 0) throw new Error('Indique el monto que toma el cliente'); if (m > +s.monto_aprobado) throw new Error(`El monto excede el aprobado (${L(s.monto_aprobado)})`); return m; })(), p_plazo: null, p_cuenta: $('#cCta').value || null });
    S.dirty = false;
    toast(r === 'por_verificar' ? 'Enviada a verificación' : 'Enviada a desembolsos por transferencia');
    await refrescar();
  });
}

    const fechas = cells.map((c, i) => [parseFecha(c), i]).filter(x => x[0]);
    if (!fechas.length) return;                                   // encabezados / líneas sin fecha
    const iPago = fechas[0][1];
    const doc = cells.find(c => /[A-Za-z]{1,5}-?\d{3,}/.test(c)) || '';
    const valorCell = cells.slice(iPago + 1).find(c => /^\s*L?\s*-?[\d,]+(\.\d+)?\s*$/.test(c) && !parseFecha(c));
    const valor = valorCell ? +valorCell.replace(/[L,\s]/g, '') : null;
    const cuota = fechas.length > 1 ? fechas[fechas.length - 1][0] : null;
    const accion = cells.slice(iPago + 1).find(c => c.trim() && !parseFecha(c) && c !== valorCell && !/^\s*[\d.,]+\s*$/.test(c)) || '';

function enlazarRefi(s){
  const card = $('#rfCard'); if (!card) return;
  const cur = () => S.detData.s;
  const recalcular = () => {
    const cs = cur(), c = calcular(S.detData.ing, cs.tipo_pago, cs.rubro_especial), r = calcRefi(cs, c);
    $('#rfRes').innerHTML = refiResHTML(cs, r); S.enlazarB && S.enlazarB();
    if ($('#dSug')) $('#dSug').innerHTML = dictamenRefiHTML(r);
    if ($('#dMonto') && !S.montoTocado) $('#dMonto').value = r.limAprob || '';
    S.actLibre && S.actLibre();
  };
  const cop = $('#rfCopiar');
  if (cop) cop.onclick = async () => {
    const cs = cur(), txt = resumenWhatsApp(cs, calcRefi(cs, calcular(S.detData.ing, cs.tipo_pago, cs.rubro_especial)));
    try { await navigator.clipboard.writeText(txt); toast('Resumen copiado. Péguelo en el grupo.'); }
    catch(e){ const w = dialogo(`<h3>Resumen</h3><textarea rows="12" readonly>${esc(txt)}</textarea><div class="btns"><button class="btn pri" data-close>Cerrar</button></div>`); w.querySelector('textarea').select(); }
  };
  const guardar = (datos) => run(null, async () => { await rpc('actualizar_datos_refi', { p_id: s.id, p_datos: datos }); Object.assign(cur(), datos); recalcular(); });
  card.querySelectorAll('[data-rf]').forEach(el => el.onchange = () => {
    let val = el.value.trim();
    if (el.type !== 'date' && el.tagName !== 'SELECT'){ const n = num(val); val = n == null ? null : el.dataset.pct ? +(n / 100).toFixed(4) : n; }
    if (el.type === 'date' && val && val > hoyHN()) return toast('La fecha no puede ser futura', true);
    guardar({ [el.dataset.rf]: val === '' ? null : val });
  });
  const enlazarB = () => {
    const ap = $('#bAplicar'); if (ap) ap.onclick = () => { if (!confirm('¿Aplicar la política tipo B? Tasa 20% nivelado, límite máximo L 5,000 y plazo 3 meses.')) return; S.montoTocado = false; guardar({ politica_b: true, plazo_meses: 3 }).then(() => toast('Política tipo B aplicada')); };
    const q = $('#bQuitar'); if (q) q.onclick = () => { S.montoTocado = false; guardar({ politica_b: false }).then(() => toast('Política tipo B quitada')); };
    const sel = card.querySelector('[data-rf="plan_pago"]'); if (sel){ if (sel.dataset.orig == null) sel.dataset.orig = (sel.disabled && !cur().politica_b) ? '1' : ''; sel.disabled = !!cur().politica_b || sel.dataset.orig === '1'; if (cur().politica_b) sel.value = 'nivelado'; }
  };
  S.enlazarB = enlazarB; enlazarB();
  const proc = $('#rfProc');
  if (proc) proc.onclick = () => {
    const nuevos = parsePagos($('#rfPegar').value);
    if (!nuevos.length) return toast('No se encontraron filas con fecha. Copie la tabla completa desde el sistema o Excel.', true);
    guardar({ pagos_historial: [...(cur().pagos_historial || []), ...nuevos] }).then(() => { toast(`${nuevos.length} pago(s) agregados`); renderDetalleParcial(); });
  };
  const limp = $('#rfLimpiar');
  if (limp) limp.onclick = () => { if (confirm('¿Borrar todo el historial de pagos?')) guardar({ pagos_historial: [] }).then(renderDetalleParcial); };
  card.querySelectorAll('[data-pdel]').forEach(b => b.onclick = () => {
    const arr = [...(cur().pagos_historial || [])]; arr.splice(+b.dataset.pdel, 1);
    guardar({ pagos_historial: arr }).then(renderDetalleParcial);
  });
}

  const UNI=["","uno","dos","tres","cuatro","cinco","seis","siete","ocho","nueve","diez","once","doce","trece","catorce","quince","dieciséis","diecisiete","dieciocho","diecinueve","veinte","veintiuno","veintidós","veintitrés","veinticuatro","veinticinco","veintiséis","veintisiete","veintiocho","veintinueve"];
  const DEC=["","","","treinta","cuarenta","cincuenta","sesenta","setenta","ochenta","noventa"];
  const CEN=["","ciento","doscientos","trescientos","cuatrocientos","quinientos","seiscientos","setecientos","ochocientos","novecientos"];
  function menorMil(n){ if(n===0) return ""; if(n===100) return "cien"; const c=Math.floor(n/100), r=n%100; let out=CEN[c];
    if(r){ const t = r<30 ? UNI[r] : DEC[Math.floor(r/10)] + (r%10 ? " y "+UNI[r%10] : ""); out=(out?out+" ":"")+t; } return out; }
  const apoc = s => s.replace(/veintiuno$/,"veintiún").replace(/uno$/,"un");
  function entero(n){ if(n===0) return "cero"; const mm=Math.floor(n/1e6), m=Math.floor((n%1e6)/1000), r=n%1000, p=[];
    if(mm) p.push(mm===1?"un millón":apoc(entero(mm))+" millones"); if(m) p.push(m===1?"mil":apoc(menorMil(m))+" mil"); if(r) p.push(menorMil(r)); return p.join(" "); }
  const titulo = s => s.replace(/(^|\s)(\S)/g,(x,a,b)=>a+b.toUpperCase()).replace(/ Y /g," y ").replace(/ Con /g," con ");
  function letras(v){ const e=Math.floor(v+1e-9), c=Math.round((v-e)*100); let s = titulo(apoc(entero(e))); if(c) s += " con " + String(c).padStart(2,"0") + "/100"; return s; }
  function cifra(v){ const cents = Math.round(v*100)%100 !== 0; return "L. " + v.toLocaleString("en-US",{minimumFractionDigits:cents?2:0,maximumFractionDigits:2}); }
  function anio(y){ const r=y%100, base = (Math.floor(y/1000)===2 ? "Dos Mil" : titulo(entero(y-r))); if(!r) return base; let t;
    if(r<=20) t = titulo(UNI[r]); else { const d=Math.floor(r/10), u=r%10; t = (d===2?"Veinte":titulo(DEC[d])) + (u ? " y "+UNI[u] : ""); } return base+" "+t; }
  function fmtId(raw){ const d=String(raw||'').replace(/\D/g,"").slice(0,13); if(d.length<=4) return d; if(d.length<=8) return d.slice(0,4)+"-"+d.slice(4); return d.slice(0,4)+"-"+d.slice(4,8)+"-"+d.slice(8); }
  function html(d){
    const sp = w => "&nbsp;".repeat(Math.max(1,Math.round(w/2.4)));
    const val = (x,w) => x ? esc(x) : sp(w);
    const f = (d.fecha || hoyHN()).split("-").map(Number);
    const m = { NOMBRE:val(d.nombre,150), ID:val(d.id,70), LETRAS:val(d.monto ? letras(d.monto) : '',60), CIFRA:val(d.monto ? cifra(d.monto) : '',40),
      DIA:val(String(f[2]),12), MES:val(MESES[f[1]-1],50), ANIO:esc(anio(f[0])) };
    return RD_DOC.replace(/\{\{(\w+)\}\}/g, (x,k) => m[k] ?? x);
  }
  return { html, letras, cifra, fmtId };
})();
const cargarScript = src => new Promise((ok, fail) => { if (document.querySelector(`script[src="${src}"]`)) return ok();
  const sc = document.createElement('script'); sc.src = src; sc.onload = ok; sc.onerror = () => fail(new Error('No se pudo cargar ' + src.split('/').pop() + '. Revise su conexión.')); document.head.appendChild(sc); });
