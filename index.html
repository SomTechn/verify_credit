const CT = (() => {
  const RTN = '05019025194918';
  const lps = v => `${RD.letras(v)} Lempiras (L. ${(+v).toLocaleString('en-US', { minimumFractionDigits:2, maximumFractionDigits:2 })})`;
  const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const fill = (v, w) => v ? `<span class="f">${esc(v)}</span>` : '_'.repeat(w || 20);
  function bloques(d){
    const f = (d.fecha || hoyHN()).split('-').map(Number);
    const dia = f[2] === 1 ? 'un (1) día' : `${RD.letras(f[2]).toLowerCase()} (${f[2]}) días`;
    return [
      `<h1>CONTRATO DE APERTURA DE LÍNEA DE CRÉDITO</h1>`,
      `<p>Entre <b>MAS PISTO S DE RL</b>, RTN No. ${RTN}, del domicilio de San Pedro Sula, en adelante <b>El Acreedor</b> y, ${fill(d.nombre, 30)}, mayor de edad, con documento nacional de identificación No. ${fill(d.id, 25)}, en adelante <b>El Deudor</b>, hemos convenido de común acuerdo en celebrar un CONTRATO DE APERTURA DE LÍNEA DE CRÉDITO y su(s) Anexo(s), en adelante todos estos documentos denominados, individual o colectivamente, como El Contrato de conformidad a lo establecido en la Ley de Préstamos de Crédito, en adelante La Ley, las Normas para el Fortalecimiento de la Transparencia, la Cultura Financiera y Atención al Usuario Financiero en las Instituciones Supervisadas y sus Normas Complementarias, en adelante Las Normas de Transparencia y Normas Complementarias de Transparencia respectivamente; a efecto de establecer las condiciones bajo las cuales el Deudor podrá disponer de su línea de crédito en cuenta corriente, conforme las cláusulas y condiciones siguientes:</p>`,
      `<p><b>I. APERTURA DE CRÉDITO:</b> Para los propósitos antes enunciados, El Acreedor otorga al Deudor en este acto, una línea de crédito en cuenta corriente por la suma de ${fill(d.minimo ? lps(d.minimo) : '', 12)} hasta la suma de ${fill(d.limite ? lps(d.limite) : '', 17)}; que se utilizará específicamente, para cancelar las obligaciones que se generen a cargo del Deudor en virtud de este contrato. El Deudor queda obligado a pagar al El Acreedor las cantidades de dinero que correspondan, según las disposiciones que haga del crédito otorgado por medio de su Préstamo, más los intereses, comisiones y demás cargos especificados en el presente contrato y que han sido aceptados por el Deudor. Queda entendido y aceptado que dicho límite de crédito en cuenta corriente podrá incrementarse previa autorización del Deudor hasta un máximo de ${fill(d.maximo ? lps(d.maximo) : '', 22)} denominado límite máximo, cuyo aumento, en todo caso, deberá estar respaldado en el análisis que realice el acreedor sobre la capacidad de pago. Este aumento será notificado por escrito al deudor.</p>`,
      `<p><b>II. PAGOS:</b> El Deudor se obliga a pagar al acreedor: a) El monto total adeudado como consecuencia del uso que haga de la línea de crédito concedida por medio de su Préstamo b) Los demás cargos y comisiones establecidos en este contrato y su Anexo; c) Cualquier otro cargo por servicio conforme lo establecido y que haya sido aceptado expresamente por el Deudor; d) El interés corriente establecido por el Acreedor; e) Un recargo mensual sobre el saldo en mora; f) El deudor queda obligado a pagar un recargo por mora en caso de incumplimiento en el plan de pagos establecidos g) En caso de incumplimiento de pago el deudor pone en garantía el menaje que se encuentre en el lugar establecido como residencia; y; h) En caso de cancelación de lo adeudado antes de cumplir un mes de otorgado el crédito, el deudor cancelara el valor total generado de los intereses de un mes aun cuando este no se ha cumplido.</p>`,
      `<p><b>III. FECHA, LUGAR Y FORMA DE PAGO:</b> El Deudor deberá efectuar, en la fecha máxima establecida por el Acreedor, el pago del saldo adeudado de los intereses generados durante el mes u otras obligaciones pendientes de pago a dicha fecha. El Acreedor detallará dichos cargos en el Estado de cuenta, El pago se deberá efectuar mediante transferencia de cuenta las cuales serán establecidas por parte del acreedor o por cualquier otro medio que el Acreedor designe, debiendo cancelar por lo menos el pago de los intereses generados a efecto de no incurrir en mora.</p>`,
      `<p><b>IV. DE LA SUSPENSIÓN DEL CRÉDITO:</b> Cuando el Deudor no pague en la fecha estipulada las obligaciones contraídas bajo este contrato, el Acreedor está facultado a suspender el uso de la línea de crédito. Este será trasladado al área legal correspondiente para la recuperación del crédito y los saldos adeudados, asumiendo el deudor todos los gastos que genere dicha gestión.</p>`,
      `<p><b>V. VIGENCIA Y PLAZO.</b> Este contrato es válido por tiempo indefinido a partir de su firma, salvo que una de las partes dé aviso por escrito a la otra parte su intención de no renovar el contrato. En los casos que el Deudor de por terminado este contrato de manera inmediata y en forma anticipada, el deudor cancelará todos los intereses acumulados y el saldo a capital vigente a la fecha de terminación, el Acreedor podrá dar por terminado este contrato de manera inmediata y en forma anticipada, en caso de incumplimiento del Deudor o bajo las demás circunstancias establecidas en la cláusula siguiente.</p>`,
      `<p><b>VI. TERMINACIÓN DEL CONTRATO Y VENCIMIENTO ANTICIPADO:</b> El plazo señalado para el pago de los montos generados como consecuencia de las disposiciones que el Deudor haga de su línea de crédito, podrá darse por vencido de manera anticipada y el Acreedor podrá suspender el uso de la línea de crédito; en los siguientes casos: a) Por falta del pago de uno o más de los cargos establecidos mensualmente en este contrato; b) En caso de descubrir que la información suministrada por el Deudor sea falsa o inexacta o no haya efectuado las notificaciones a que se obliga en virtud de este contrato. c) Cuando el Deudor incumpla cualquiera de las obligaciones que asume por este contrato de apertura de crédito. d) En caso de no notificar al El Acreedor el cambio de domicilio.</p>`,

function fmtDur(sec){
  if (sec == null || isNaN(sec)) return '—';
  sec = Math.max(0, Math.round(sec));
  if (sec < 60) return '<1 min';
  const m = Math.floor(sec / 60), h = Math.floor(m / 60), d = Math.floor(h / 24);
  if (h < 1) return `${m} min`;
  if (d < 1) return `${h} h ${String(m % 60).padStart(2,'0')} min`;
  return `${d} d ${h % 24} h`;
}
// Segundos hábiles (misma regla que la BD: L-V 8:30–16:30, sáb 8:30–12:00, sin domingos ni feriados). Honduras = UTC-6 fijo.
function segHabiles(t0, t1){
  const P = S.params, off = 6 * 3600e3;
  const a = new Date(t0).getTime() - off, b = new Date(t1).getTime() - off;
  if (!(b > a)) return 0;
  const hi = (P.hora_inicio ?? 8.5) * 3600e3, hlv = (P.hora_cierre_lv ?? 16.5) * 3600e3, hs = (P.hora_cierre_sab ?? 12) * 3600e3;
  let tot = 0, da = new Date(a), d = Date.UTC(da.getUTCFullYear(), da.getUTCMonth(), da.getUTCDate());
  for (; d <= b; d += 864e5){
    const dt = new Date(d), dow = dt.getUTCDay();
    if (dow === 0 || S.feriados.has(dt.toISOString().slice(0,10))) continue;
    const ini = Math.max(d + hi, a), fin = Math.min(d + (dow === 6 ? hs : hlv), b);
    if (fin > ini) tot += fin - ini;
  }
  return Math.round(tot / 1000);
}

function hFiltrar(){

    if (f.tipo && s.tipo !== f.tipo) return false;

    if (f.verificador && (f.verificador === 'sin' ? s.verificador_id : s.verificador_id !== f.verificador)) return false;
    if (f.forma && s.forma_desembolso !== f.forma) return false;

}

}

const MESES_C = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function rango(k){
  const h = hoyHN(), d = new Date(h + 'T12:00');
  const iso = x => x.toLocaleDateString('en-CA');
  if (k === 'hoy') return [h, h];
  if (k === '7d'){ const a = new Date(d); a.setDate(a.getDate()-6); return [iso(a), h]; }
  if (k === '30d'){ const a = new Date(d); a.setDate(a.getDate()-29); return [iso(a), h]; }
  if (k === 'mes') return [h.slice(0,8) + '01', h];
  if (k === 'mesant'){ const a = new Date(d.getFullYear(), d.getMonth()-1, 1, 12), b = new Date(d.getFullYear(), d.getMonth(), 0, 12); return [iso(a), iso(b)]; }

}

  const us = Object.values(S.perfiles);
  $('#main').innerHTML = `<div class="btns" style="margin:0 0 10px"><button class="btn pri" id="uNuevo">＋ Nuevo usuario</button></div>
    ${us.map(u => `<div class="card row">${av(u.id)}<div style="flex:1;min-width:0"><b>${esc(u.nombre)}</b> ${u.activo ? '' : '<span class="chip c-red">Inactivo</span>'}<div class="small muted">${esc(u.email||'')} · ${ROL[u.rol]}</div></div><button class="btn sm ghost" data-u="${u.id}">Editar</button></div>`).join('')}`;
  $('#uNuevo').onclick = () => {
    const w = dialogo(`<h3>Nuevo usuario</h3>
      <label class="f">Nombre</label><input id="uN"><label class="f">Correo</label><input id="uE" type="email">
      <label class="f">Contraseña (mín. 6)</label><input id="uP" type="text">
      <label class="f">Rol</label><select id="uR">${Object.entries(ROL).map(([k,v]) => `<option value="${k}">${v}</option>`).join('')}</select>
      <div class="btns"><button class="btn ghost" data-close>Cancelar</button><button class="btn pri" id="uOk">Crear</button></div>`);
    w.querySelector('#uOk').onclick = e => run(e.target, async () => {
      await fnUsuarios({ accion:'crear', nombre: $('#uN').value, email: $('#uE').value, password: $('#uP').value, rol: $('#uR').value });
      cerrarDialogo(w); await cargarPerfiles(); pintarUsuarios(); toast('Usuario creado');
    });
  };
  $('#main').querySelectorAll('[data-u]').forEach(b => b.onclick = () => {
    const u = S.perfiles[b.dataset.u];
    const w = dialogo(`<h3>${esc(u.nombre)}</h3>
      <label class="f">Nombre</label><input id="eN" value="${esc(u.nombre)}">
      <label class="f">Rol</label><select id="eR">${Object.entries(ROL).map(([k,v]) => `<option value="${k}" ${u.rol===k?'selected':''}>${v}</option>`).join('')}</select>
      <label class="chk" style="margin-top:10px"><input type="checkbox" id="eA" ${u.activo?'checked':''}> Activo</label>
      <label class="f">Nueva contraseña (opcional)</label><input id="eP" type="text" placeholder="Dejar vacío para no cambiar">
      <div class="btns"><button class="btn ghost" data-close>Cancelar</button><button class="btn pri" id="eOk">Guardar</button></div>`);
    w.querySelector('#eOk').onclick = e => run(e.target, async () => {
      await rpc('actualizar_perfil', { p_id: u.id, p_nombre: $('#eN').value, p_rol: $('#eR').value, p_activo: $('#eA').checked });
      if ($('#eP').value) await fnUsuarios({ accion:'password', user_id: u.id, password: $('#eP').value });
      cerrarDialogo(w); await cargarPerfiles(); pintarUsuarios(); toast('Guardado');
    });
  });
}
function pintarParams(){
  $('#main').innerHTML = `<div class="alert info small">Estos valores controlan el cálculo del análisis de ingresos (igual que la hoja de Excel).</div>
    ${S.paramsRows.map(p => `<div class="card"><label class="f" style="margin-top:0">${esc(p.descripcion)}</label>
      <div class="row"><input data-p="${esc(p.clave)}" value="${p.valor}" inputmode="decimal"><button class="btn sm pri" data-ps="${esc(p.clave)}">Guardar</button></div></div>`).join('')}`;
  $('#main').insertAdjacentHTML('beforeend', `<h4 class="sec">Feriados (no cuentan como tiempo hábil)</h4>
    <div class="card"><table class="t"><tbody>${S.feriadosRows.map(f => `<tr><td>${fDate(f.fecha+'T12:00')}</td><td>${esc(f.descripcion)}</td><td style="width:30px"><button class="x" data-fd="${f.fecha}">×</button></td></tr>`).join('') || '<tr><td class="muted">Sin feriados</td></tr>'}</tbody></table>
    <div class="addrow" style="grid-template-columns:1fr 1.4fr auto"><input type="date" id="fFecha"><input id="fDesc" placeholder="Descripción"><button class="btn pri" id="fAdd">Agregar</button></div></div>`);
  $('#main').querySelectorAll('[data-ps]').forEach(b => b.onclick = () => run(b, async () => {
    const v = num(document.querySelector(`[data-p="${b.dataset.ps}"]`).value); if (v == null) throw new Error('Valor inválido');
    await rpc('actualizar_parametro', { p_clave: b.dataset.ps, p_valor: v }); await cargarParams(); toast('Parámetro actualizado');
  }));
  $('#fAdd').onclick = e => run(e.target, async () => {
    if (!$('#fFecha').value) throw new Error('Seleccione la fecha');
    await rpc('guardar_feriado', { p_fecha: $('#fFecha').value, p_descripcion: $('#fDesc').value }); await cargarParams(); pintarParams(); toast('Feriado agregado');
  });
  $('#main').querySelectorAll('[data-fd]').forEach(b => b.onclick = () => run(b, async () => {
    if (!confirm('¿Quitar este feriado?')) return;
    await rpc('guardar_feriado', { p_fecha: b.dataset.fd, p_descripcion: null, p_borrar: true }); await cargarParams(); pintarParams();
  }));
}

// ================== Tiempo real ==================
let tRe = null, canal = null;
function suscribir(){
  if (canal) sb.removeChannel(canal);
  canal = sb.channel('vc')
    .on('postgres_changes', { event:'*', schema:'public', table:'solicitudes' }, p => { avisar(p); programarRecarga(p); })
    .on('postgres_changes', { event:'*', schema:'public', table:'comentarios' }, p => {
      const sid = p.new?.solicitud_id || p.old?.solicitud_id;
      if (S.det && (!sid || sid === S.det)) cargarComentarios();
      if (p.eventType === 'INSERT' && p.new.autor_id !== S.me.id && p.new.solicitud_id !== S.det){
        const s = S.sols.find(x => x.id === p.new.solicitud_id);
        if (s) notificar(`💬 ${nombre(p.new.autor_id)} comentó en ${s.nombre_cliente}`, p.new.texto.slice(0,80), s.id);
      }
      programarRecarga();
    })
    .on('postgres_changes', { event:'*', schema:'public', table:'refi_clientes' }, p => rfCambio(p))
    .on('postgres_changes', { event:'*', schema:'public', table:'refi_cortes' }, p => rfCambio(p, true))
    .on('postgres_changes', { event:'*', schema:'public', table:'comentario_likes' }, () => { if (S.det) cargarComentarios(); })
    .on('postgres_changes', { event:'*', schema:'public', table:'ingresos' }, p => {
      const sid = p.new?.solicitud_id || p.old?.solicitud_id;
      if (S.det && sid === S.det && !S.dirty) recargarIngresos();
    })
    .subscribe(st => { if (st === 'CHANNEL_ERROR' || st === 'TIMED_OUT') setTimeout(suscribir, 5000); });
}
function programarRecarga(p){
  clearTimeout(tRe);
  tRe = setTimeout(async () => {
    const antes = S.det ? S.sols.find(x => x.id === S.det) : null;
    await cargarSolicitudes(); pintarTabs();
    if ($('#sheet').classList.contains('hidden')) pintar();
    else if (antes){
      const ahora = S.sols.find(x => x.id === S.det);
      if (ahora && ahora.estado !== antes.estado){
        if (S.dirty){ toast(`Esta solicitud cambió a "${EST[ahora.estado].t}". Cierre y vuelva a abrir para ver los cambios.`); }
        else abrirDetalle(S.det, true);
      }
    }
  }, 600);
}
function avisar(p){
  if (p.eventType !== 'UPDATE' && p.eventType !== 'INSERT') return;
  const s = p.new, prev = S.sols.find(x => x.id === s.id);
  if (prev && prev.estado === s.estado) return;
  const n = s.nombre_cliente;
  if (s.estado === 'en_analisis' && es('analista')) notificar('Nueva solicitud en análisis', `${n} · ${TIPO[s.tipo]}`, s.id);
  else if (['aprobada','denegada'].includes(s.estado) && s.asesor_id === S.me.id) notificar(`Solicitud ${EST[s.estado].t.toLowerCase()}`, n, s.id);
  else if (s.estado === 'borrador' && prev?.estado === 'en_analisis' && s.asesor_id === S.me.id) notificar('Solicitud devuelta para corregir', n, s.id);
  else if (s.estado === 'por_verificar' && rol() === 'verificador' && (!s.verificador_id || s.verificador_id === S.me.id)) notificar('Nueva verificación asignada', n, s.id);
  else if (s.estado === 'desembolso_pendiente' && es('analista')) notificar('Desembolso por transferencia pendiente', n, s.id);
}
function notificar(t, b, id){
  toast(`${t}: ${b}`);
  try { if ('Notification' in window && Notification.permission === 'granted' && document.hidden){
    const nt = new Notification(t, { body: b, tag: 'vc-' + id }); nt.onclick = () => { window.focus(); abrirDetalle(id); };
  } } catch(e){}
}
document.addEventListener('visibilitychange', async () => {
  if (!document.hidden && S.me){ await cargarSolicitudes(); pintarTabs(); if ($('#sheet').classList.contains('hidden')) pintar(); }
});
setInterval(async () => { if (S.me && !document.hidden && $('#sheet').classList.contains('hidden')){ await cargarSolicitudes(); pintarTabs(); if (!document.activeElement || document.activeElement.id !== 'q') pintar(); } }, 60000);

sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT') location.reload(); });
init();
</script>
